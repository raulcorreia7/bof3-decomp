name: ci

# Disc-free checks: `tools/pre_push.sh` without `check` (format, headers, tree, externs, addresses, type loss, quality and tool tests). The byte-exact `check` runs locally.

on:
  push:
    branches: [main]
  pull_request:
  # A run on `main` writes the caches where every pull request can read them: GitHub scopes a cache
  # to the branch that saved it, and a pull request's run saves under `refs/pull/<n>/merge`.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer commit replaces the run for the same branch; `verify-main.sh` runs the byte-exact check
  # on main and reverts a merge that fails it, so a cancelled push run loses nothing.
  cancel-in-progress: true

jobs:
  # A squash merge carries the file content the pull request's `disc-free` run already checked.
  # Skip the push run when that check passed, so main is checked only when the content differs.
  checked:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty') || number=
          if [ -n "$number" ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .head.sha)
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "disc-free" and .conclusion == "success")] | length > 0')
            if [ "$passed" = true ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  disc-free:
    needs: checked
    # `checked` is skipped on a pull request, and a job that needs a skipped job is skipped too
    # unless its condition calls a status function: without !cancelled() a pull request runs nothing.
    if: ${{ !cancelled() && needs.checked.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Docs-only pull requests skip the build steps.
      - id: changes
        name: Changes
        shell: bash
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The base commit and every commit of the pull request are in the clone (fetch-depth: 0).
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD") || files=unknown
            code=false
            if printf '%s\n' "$files" | grep -qvE '^(.*\.md|docs/.*|LICENSE[^/]*|NOTICE|\.github/ISSUE_TEMPLATE/.*|\.agents/.*)$'; then code=true; fi
            if printf '%s\n' "$files" | grep -qE '^\.github/workflows/'; then code=true; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6
        with:
          dprint-version: 0.64.3
          cache: true
      - if: steps.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchains/gcc-2.7.2-psx
            toolchains/psyq-compilers
            toolchains/psn00b_toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}
      # `check-plain` keeps one empty file per preprocessed source it compiled, a few megabytes in
      # all. A file's name covers the compiler, the flags and the preprocessed text, so a stale
      # entry cannot pass a changed source; restoring them replaces most compiles with a
      # preprocess. The 9 GB object cache beside it is not restored.
      - if: steps.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bof3-cc/plain
          key: plain-check-${{ runner.os }}-${{ hashFiles('tools/check_plain.sh', 'tools/setup.sh') }}
          restore-keys: plain-check-${{ runner.os }}-
      # The compiler and tracked headers only: no SDK object is downloaded or built.
      - if: steps.changes.outputs.code == 'true'
        run: tools/setup.sh --dev --no-payloads --no-sdk
      - if: steps.changes.outputs.code == 'true'
        run: uv tool install clang-format==23.1.3
      - if: steps.changes.outputs.code == 'true'
        run: uv tool install meson==1.12.1
      - if: steps.changes.outputs.code == 'true'
        run: uv tool install ninja==1.13.0
      - run: uv tool install shellcheck-py==0.11.0.1
      - name: Compare with main
        if: steps.changes.outputs.code == 'true'
        run: |
          git fetch --no-tags origin +main:refs/remotes/origin/main
          git update-ref refs/heads/main refs/remotes/origin/main
      - name: Shell syntax
        run: git ls-files 'tools/*.sh' 'bin/*' | xargs -n 1 sh -n
      # Warnings and errors fail; the info notes flag intended word splitting and A && B || C chains.
      - name: Shell lint
        run: git ls-files 'tools/*.sh' | xargs shellcheck --severity=warning
      # dprint/check above covers Markdown, TOML and JSON; DPRINT=true makes format-check skip the second run.
      # format.sh --check also runs `ruff check` on tools/ (ruff is pinned in pyproject.toml).
      # check-headers, check-tree, include-asm, format-check (ruff included), meson test, typeloss.
      - if: steps.changes.outputs.code == 'true'
        run: meson setup build/meson
      - if: steps.changes.outputs.code == 'true'
        env:
          DPRINT: "true"
          # ubuntu-latest has four vCPUs. `check-plain` defaults to nproc/4 for a lane that shares a
          # loaded host, which would leave this job one core and make its cold run ten minutes.
          HEAVY_JOBS: "4"
        run: tools/pre_push.sh refs/remotes/origin/main
      # A failure before pre-push (for example shell lint) leaves no logs to print.
      - name: Failed check logs
        if: failure() && steps.changes.outputs.code == 'true' && hashFiles('build/pre-push/*.log') != ''
        run: tail -n 40 build/pre-push/*.log
      - name: No SDK object in the tree
        run: test -z "$(find . -path ./.venv -prune -o \( -iname '*.obj' -o -iname '*.lib' \) -print)"
