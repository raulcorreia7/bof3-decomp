name: CodeQL

# Scans the Python tools and the workflows, the two languages this repository's code runs in. A pull
# request that changes only the game sources, headers, split config or assembly compiles no object
# CodeQL analyzes, so it skips the scan instead of spending a minute on nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["src/**", "include/**", "config/**", "asm/**", "docs/**", "*.md"]
  pull_request:
    paths-ignore: ["src/**", "include/**", "config/**", "asm/**", "docs/**", "*.md"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:${{ matrix.language }}"
