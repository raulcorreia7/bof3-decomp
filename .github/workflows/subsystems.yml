name: subsystems
# Refreshes the debt table of docs/subsystems.md in one pull request, so feature pull requests never
# touch the file. Set the repository secret SUBSYSTEMS_TOKEN (a token that can open pull requests) so
# the pull request runs the required checks; the default token's pull requests start none.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.SUBSYSTEMS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/quality.py --markdown --update
      - name: Open or update the pull request
        env:
          TOKEN: ${{ secrets.SUBSYSTEMS_TOKEN }}
        run: |
          git diff --quiet docs/subsystems.md && exit 0
          # Without the token the default token cannot open a pull request here, and one it opened
          # would run no checks; stop before pushing a branch nobody will read.
          if [ -z "$TOKEN" ]; then
            echo "::error::Set the SUBSYSTEMS_TOKEN secret to a token that can open pull requests."
            exit 1
          fi
          branch=chore/subsystems-table
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # One open pull request at a time; its table is refreshed after it merges.
          [ -n "$(gh pr list --head "$branch" --json number -q '.[0].number')" ] && exit 0
          git push "$remote" --delete "$branch" || true
          git config user.name raulcorreia7
          git config user.email raulcorreia7@users.noreply.github.com
          git checkout -b "$branch"
          git commit -m "docs(tools): refresh the subsystem debt table" docs/subsystems.md
          git push "$remote" "$branch"
          if ! gh pr create --base main --head "$branch" --title "docs(tools): refresh the subsystem debt table" \
            --body "Generated by \`tools/quality.py --markdown --update\` (workflow \`subsystems\`)."; then
            git push "$remote" --delete "$branch" || true
            exit 1
          fi
          gh pr merge "$branch" --squash --auto
