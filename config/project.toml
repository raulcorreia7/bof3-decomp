# objdiff project generation.
#
# One unit per compiled C source under src/: the target object is assembled
# from the split asm, the base object is the object compiled from that source.
# The script (tools/objdiff_config.py) is game-agnostic; every BoF3-specific path and
# category is named here.
schema = "bof3.project/v1"

[objdiff]
# Targets are the layouts under config/: each names its payload and source folder.
src = "src"
asm = "asm"
# The build directory, from --build-dir, holds the objects and the project.
report = "build/report.json"
library_units = "config/sdk/library-units.jsonl"
assembler = "bin/internal/binutils/as"
objcopy = "bin/internal/binutils/objcopy"
nm = "bin/internal/binutils/nm"
assembler_flags = ["-G0", "-EL", "-mips1"]
asm_include = ["include/match"]
match_marker = "^[ \t]*MATCH\\b"
func_address = "^func_([0-9A-Fa-f]{8})$"
# A data symbol named by its retail address is resolved in the target object:
# the C compiler folds a constant address into the instruction, and objdiff
# relaxes a target value against a base relocation but not the reverse.
data_address = "^(?:D|T|jtbl)_([0-9A-Fa-f]+)$"
nonmatching_suffix = ".NON_MATCHING"
data_label = "dlabel"
hand_marker = "\nHAND_ASM "
hand_dir = "hand"
data_dir = "data"
game_category = "game"
sdk_category = "sdk"
hand_category = "hand-asm"

# A unit carries exactly one of these: the game totals read the `game` category
# only, so SDK library code and hand-written assembly never enter them.
[[objdiff.category]]
id = "game"
name = "Game code rebuilt in C"

[[objdiff.category]]
id = "sdk"
name = "PsyQ SDK (shown apart)"

[[objdiff.category]]
id = "hand-asm"
name = "Hand-written assembly (shown apart)"
