["emi/world02/area104/14"]
g_BGMTracks = { addr = 0x80181EB8, size = 0x294, source = "Music tracks: the BGM archive slot, SEP package and sequence of each track id." }
UI_MessageRunArea = { addr = 0x801F2F0C, type = "func", source = "Starts message 4 with UI_MessageStartArea, waits until g_GameStateIndex leaves 2, then clears the script-active flag and the D_801448EB state." }
Area_SceneInitActor = { addr = 0x801F3124, type = "func", source = "Sets active_flags to 0x80, looks up scene record 0x158, sets byte 0x29 to 5, clears byte 0x2A and the tint bytes and sets header.mode (byte 0x01) to 1." }
Actor_ZoomIn = { addr = 0x801F32E8, type = "func", source = "Grows the actor scale at offset 0x40 by 0x2000 each frame and sets header.mode (byte 0x01) to 3 when the timer at byte 0x09 expires." }
Area_RequestRestartOnEntryChange = { addr = 0x801F3364, type = "func", source = "Outside game entry state 1, when the step byte 0x0B no longer matches option_flags, an area change is requested, or a step-1 actor no longer matches g_GameEntryAreaId, arms the restart: byte 0x48 to 2, timer to 8, header.mode to 4." }
Actor_ZoomOut = { addr = 0x801F3424, type = "func", source = "Centres the actor on the screen and shrinks the scale at +0x40 by 0x2000 each frame; when the timer at byte 0x09 reaches 0 it frees the actor if g_GameStateIndex is GAME_REQUEST_AREA_CHANGE, otherwise it clears byte 0x48 and sets header.mode (byte 0x01) to 1." }
Actor_SetScreenOrigin = { addr = 0x801F34C4, type = "func", source = "Sets the actor screen_x to 0xA0 and screen_y to 0x50." }
Actor_NextStep = { addr = 0x801F3524, type = "func", source = "Zeroes the work bytes 0x09 and 0x0B and adds 1 to header.mode (byte 0x01)." }
Actor_SlideScreenLeft = { addr = 0x801F35D0, type = "func", source = "Sets the actor screen_x to -0x30 and adds 1 to header.step (byte 0x02), when D_801454F2 is not 2 and no script is active." }
Actor_SlideScreenX = { addr = 0x801F3620, type = "func", source = "Adds ACTOR_SCREEN_X_STEP to the screen origin of the work record and, once it reaches ACTOR_SCREEN_X_THRESHOLD, adds 1 to the step (byte 0x02); runs Area_Update." }
Area_Update = { addr = 0x801F367C, type = "func", source = "Sets header.step (byte 0x02) to 3 when D_801454F2 is 2, then draws the area HUD at the actor screen_x with Area_DrawHud." }
Area_SlideHudBannerLeft = { addr = 0x801F36CC, type = "func", source = "Moves the HUD banner screen_x 16 pixels left per frame and sets header.step (byte 0x02) to 0 below -47; sets it to 1 when D_801454F2 is not 2; draws HUD record 0x10 at the banner x." }
Actor_SetScreenBottom = { addr = 0x801F3794, type = "func", source = "Sets the actor screen_y to 0xF0 and adds 1 to byte 0x03, when D_801454F2 is 0 or byte 0x0B is 0, no message is requested and no script is active." }
Area_RaiseHudBanner = { addr = 0x801F3814, type = "func", source = "Moves the HUD banner screen_y 10 units up per frame and adds 1 to byte 0x03 below y 201; D_801454F2 with the flag at byte 0x0B, a message request or an active script set byte 0x03 to 3; draws banner record 0x5C at screen_y." }
Area_CountHudBannerHold = { addr = 0x801F38EC, type = "func", source = "Counts the hold timer up to 90 frames and then sets the flag at byte 0x0B; with D_801454F2 set and that flag, a message request or an active script it adds 1 to byte 0x03; draws banner record 0x5C at screen_y." }
Area_StepHudBannerDown = { addr = 0x801F39EC, type = "func", source = "Moves the HUD banner screen_y 10 units down per frame and zeroes byte 0x03 from y 240; without D_801454F2, a message request or an active script it sets byte 0x03 to 1; draws banner record 0x5C at screen_y." }
Area_DrawHudSprite = { addr = 0x801F3A9C, type = "func", source = "Draws one sprite at (x, y) from the four-byte (w, h, u0, v0) cell selected by sprite_id, clut WORLD_SPRITE_CLUT; Area_DrawHud calls it with ids 0 to 3 and the WorldMapMarker step." }
Area_DrawHud = { addr = 0x801F3BC4, type = "func", source = "Draws the area HUD at (x, y) when a g_AreaDrawFlags draw bit is set: sprite 0, then the button sprite of the WorldMapMarker matching g_InputMasks[FIELD_INPUT_INTERACT] at y + 8 and the one matching g_InputMasks[FIELD_INPUT_PERSONAL_ACTION] at y + 0x10, sprite 3 when the target cell or walk flags block, and Area_DrawGradientDiamond at (x + 0x18, y + 0x18)." }
Area_DrawGradientDiamond = { addr = 0x801F3F90, type = "func", source = "Builds the diamond (-10,0), (0,-4), (0,4), (10,0), turns it by g_AreaCameraAngle, projects it and queues one POLY_G4 at (x - 0x9E, y - 0x76); Area_DrawHud calls it with its x and y plus 0x18." }
Area_DrawHudBanner = { addr = 0x801F4188, type = "func", source = "Draws the HUD banner when a draw flag is set: banner sprites 4 and 5 at x and x+0x80 and the title text at the offset in the first halfword of the executable text bank." }
Actor_FacingToward = { addr = 0x801F4A34, type = "func", source = "Returns the eight-way facing code (a g_FacingSteps row) that points from the actor row to the given position: the signs of dx and dy against the row's x and y select 0 to 7, and equal positions give 1 (func_801F4A34 in area104/14, func_801F4F78 in area121/14)." }
Game_RequestMenuOnInput = { addr = 0x801F5034, type = "func", source = "When the FIELD_INPUT_MENU button is pressed and GAME_FLAG_MENU_LOCK is clear: plays SE EMI_SE_ID(1, 5), sets g_GameStateIndex to GAME_REQUEST_MENU, clears the actor step and returns 1; otherwise returns 0." }
Actor_StopMoving = { addr = 0x801F5108, type = "func", source = "Zeroes the actor velocity vx, vy and vz and g_AreaCameraSpeed and g_AreaCameraHeightDelta, and sets g_Game.current u.field.counter_11C to 3." }
Actor_TurnByPad = { addr = 0x801F5140, type = "func", source = "Turns the task facing by the held pad direction: down reverses it, right steps it forward, left steps it back; returns 0 when no direction is held." }
Area_UpdatePanelRun = { addr = 0x801F51F0, type = "func", source = "Sets the panel step counter (g_Game.current u.field.counter_11C) to 4 while the run button (WORLD_INPUT_RUN) is held and the actor's byte 0x0B is under 0x40, and to 3 otherwise." }
Area_UpdateRunGauge = { addr = 0x801F5254, type = "func", source = "Steps the run gauge (byte 0x0B of g_Self, 0 to 0x40) once the re-arm timer at byte 0x0A is spent: while g_InputMasks[WORLD_INPUT_RUN] is held in g_PadStates[0].held it adds 1 per frame and at 0x40 re-arms the timer to 0x1E; on release it lowers the gauge by 3, 2 or 1 for levels from 0x31, from 0x21 and below, halved when header.step (byte 0x02) is nonzero." }
Area_SpawnSpinEffect = { addr = 0x801F578C, type = "func", source = "Starts the effect row's scene step: stores the party facing, seeds the panel, tints the row, advances its mode and spawns four rows of type 0x5C eight frames apart, each drawing a rotating semi-transparent quad above the party; at the Tidal Caves entrance without the Sea Charts it spawns none." }
Area_EndTurn = { addr = 0x801F58E8, type = "func", source = "Stores direction into the last-heading byte D_80145E98 unless a turn to it or to its opposite is refused, then runs the image's step." }
Area_StartTurn = { addr = 0x801F5988, type = "func", source = "Begins one turning step: when direction is within two steps of the stored direction D_80145E98, moves direction one step toward it, sets the turn velocity at +0x14 to -0x40 or +0x40, the 8-frame timer at +0x09 and state_01 to 2, stores the new direction in D_80145E98, runs Area_UpdateTurn once and returns 1, else returns 0; Area_EndTurn calls it for the direction and for its opposite (direction ^ 4)." }
Area_UpdateTurn = { addr = 0x801F5AB4, type = "func", source = "Runs one frame of a turning step: adds the velocity at +0x14 to the angle at +0x6C (masked to 0xFFF), counts the timer at +0x09 down and, at zero, sets state_01 to 1 and calls Area_EndTurn, else calls the image's per-frame sync; Area_StartTurn calls it." }
