["emi/world04/area164/13"]
g_AreaModuleId = { addr = 0x801F2C00, source = "Module id of the area: the first payload word of its overlay, 52 + the area number." }
Area_UpdateEvent = { addr = 0x801F2C04, type = "func", source = "Runs the entry of D_801F3418 that header.step (byte 0x02) of the current g_Self selects." }
Actor_AdvanceWhenPartyNear = { addr = 0x801F2DB8, type = "func", source = "Runs Area_Update after WorldMap_AdvanceWhenPartyNear, which adds 1 to header.step (byte 0x02) and plays SE EMI_SE_ID(2, 0) when g_GameStateIndex is 0, once the party is within half a cell of the work cell along one axis and within a cell of it along the other (axes by direction)." }
Actor_SlideScreenX = { addr = 0x801F2EF8, type = "func", source = "Adds ACTOR_SCREEN_X_STEP to the screen origin of the work record and, once it reaches ACTOR_SCREEN_X_THRESHOLD, adds 1 to the step (byte 0x02); runs Area_Update." }
Actor_AdvanceWhenPartyAway = { addr = 0x801F2F54, type = "func", source = "Adds 1 to header.step (byte 0x02) when the party position (D_80145EC4, D_80145EC8) is more than two cells from the work cell along one axis, or from both of its halves along the other (axes by direction); then runs Area_Update." }
Actor_SlideScreenDown = { addr = 0x801F3064, type = "func", source = "Subtracts 0x20 from the actor screen_y; at 0 or below sets header.step (byte 0x02) to 1 and plays SE EMI_SE_ID(2, 1) when g_GameStateIndex is GAME_REQUEST_IDLE; then runs Area_Update." }
Area_Update = { addr = 0x801F30D4, type = "func", source = "Sets header.step (byte 0x02) to 3 when D_801454F2 is 2, then draws the area HUD at the actor screen_x with Area_DrawHud." }
