["emi/boss/boss054/16"]
Battle_MarkDamaged = { addr = 0x800A9820, type = "func", source = "Marks the selected battlers as damaged." }
Boss_InstallBattleHooks = { addr = 0x800C1930, type = "func", source = "Installs the boss battle hooks of boss054: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C1968, type = "func", source = "Handles the boss battle events of boss054: ignores every event mode and returns 0." }
Boss_ChooseBattleEnding = { addr = 0x800C1970, type = "func", source = "Chooses how the boss battle of boss054 ends (g_BattleChooseEndingHook). On victory sets script variable 0 to 50, runs Battle_EndVictory; otherwise runs Battle_EndDefeat." }
Boss_EndBattle = { addr = 0x800C19BC, type = "func", source = "Ends the boss battle of boss054 (g_BattleEndHook): does nothing." }
Effect_StartPlaying = { addr = 0x800C1CFC, type = "func", source = "Raises BATTLE_STATE_EFFECT_PLAYING and clears the effect work record in the boss054 battle." }
Battle_EndVictory = { addr = 0x801DDED8, type = "func", source = "Ends the battle in victory: sets the battle phase to the result mode at step 1, which plays the victory sequence, poses the party and opens the result panel. Boss battles call it from their ending hook when the result is a victory.", alias = true }
Battle_EndDefeat = { addr = 0x801DDF00, type = "func", source = "Ends the battle in defeat: sets the battle phase to the result mode at step 2, which plays the defeat sequence and shows the defeat message. Boss battles call it from their ending hook when the result is not a victory.", alias = true }
g_BattleEffectBattler = { addr = 0x801EB4E0, source = "the battler the running effect acts on; Battle_UpdateEffects stores it for each effect step (emi/battle/battle/03 owns the cell)" }
g_BattleEffects = { addr = 0x801EC330, alias = true, source = "Battle effect work records (stride 0x78); Battle_AllocEffect claims a free one by setting bit 0 of header.flags." }
