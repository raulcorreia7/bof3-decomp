["emi/world04/area188/13"]
jtbl_801F2C04 = { addr = 0x801F2C04, type = "Callback", size = 0x38, source = "The switch table of func_801F4B80: 14 jump targets of its jr dispatch." }
Area_UpdateSpawn = { addr = 0x801F3598, type = "func", source = "Runs one frame of the spawn work: claims a slot every fourth frame (unk_06 & 3 is 0), runs AREA_SPAWN_TICK and Area_UpdateSpawnSlots, counts the timer down and, at 0, copies the coordinates at +0x64, +0x68 and +0x6C into +0x18, +0x1C and gravity, sets vx to -0x1000 and vy to -0x400 and adds 1 to header.mode (byte 0x01)." }
GFX_DrawColorFan = { addr = 0x801F38E0, type = "func", source = "same body as emi/scenario/sce15ef0/00@0x801D1A20 GFX_DrawColorFan" }
Area_DrawYellowLine = { addr = 0x801F3ADC, type = "func", source = "Draws a yellow line from one point to another: two one-pixel-offset gradient quads with the colour byte intensity on the red and green channels, then up to eight dots stepped back along the line." }
Area_ClearWorkColumn = { addr = 0x801F3DB4, type = "func", source = "Zeroes byte 0 of each of the 0x80 work rows, 0x14 bytes apart." }
Area_ClaimSpawnSlot = { addr = 0x801F3DE0, type = "func", source = "Claims the first free of the eight spawn slots at the work window: sets it active and copies the actor position, with the image's life, radius and centre shade; the area098, area172 and area188 scene steps call it every fourth frame (unk_06 & 3 == 0) before Area_UpdateSpawnSlots." }
Area_UpdateSpawnSlots = { addr = 0x801F3E7C, type = "func", source = "Ages every active spawn slot: counts the life byte down, shrinks the radius halfword the draw reads as the disc radius, frees the slot at zero and calls Area_DrawSpawnSlot; returns whether any slot was active, the scene steps ignore it." }
Area_DrawSpawnSlot = { addr = 0x801F3F30, type = "func", source = "Draws one spawn slot as a 32-segment fan of semi-transparent Gouraud triangles around the projected slot position (its +0x14 halfword is the radius, +0x16 the centre shade, +0x17 the rim shade)." }
Area_DrawSpinTriangle = { addr = 0x801F40F4, type = "func", source = "Draws one spin-effect triangle: a gradient POLY_G3 from the record origin and its two rotated vertex offsets, shaded by the record fade; the sibling of Area_InitSpin." }
Area_InitSpin = { addr = 0x801F4394, type = "func", source = "Starts one spin-effect record: copies the actor position to the origin, rotates two opposite unit vertices by a random rotation and picks the scale; the retail sprite pass reads these fields." }
Actor_WalkWhileWithinLimit = { addr = 0x801F4840, type = "func", source = "While the actor y plus the y step of its facing is at most the scene limit table entry for g_SceneEventSelection << 16, sets script unk_07 to 1, starts the script walk toward facing 5 with Area_MoveActorRoute and backs the script cursor up by 2." }
Area_AddCameraOffsetY2 = { addr = 0x801F48E0, type = "func", source = "Adds 2 to g_AreaCameraOffsetY, the Y shift Area_SetCameraMatrix adds to the projected camera translation, and sets g_AreaCameraRefreshCount to 2 so the camera refreshes for two frames." }
Area_SubCameraOffsetY2 = { addr = 0x801F4908, type = "func", source = "Subtracts 2 from g_AreaCameraOffsetY, the Y shift Area_SetCameraMatrix adds to the projected camera translation, and sets g_AreaCameraRefreshCount to 2 so the camera refreshes for two frames." }
Area_ResetCameraOffsetY = { addr = 0x801F4930, type = "func", source = "Zeroes g_AreaCameraOffsetY, the Y shift of the camera, and sets g_AreaCameraRefreshCount to 2 so the camera refreshes for two frames." }
