["emi/boss/boss013/16"]
Battle_ShowActorEntry = { addr = 0x800AC844, type = "func", source = "Clears the hidden flag of the actor entry entry_id, which draws the battler again.", alias = true }
jtbl_800C1804 = { addr = 0x800C1804, type = "Callback", size = 0x18, source = "The switch table of func_800C2138: 6 jump targets of its jr dispatch." }
Boss_InstallBattleHooks = { addr = 0x800C200C, type = "func", source = "Installs the boss battle hooks of boss013: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C2044, type = "func", source = "Handles the boss battle events of boss013: ignores every event mode and returns 0." }
Boss_ChooseBattleEnding = { addr = 0x800C204C, type = "func", source = "Chooses how the boss battle of boss013 ends (g_BattleChooseEndingHook). On victory sets script variable 0 to 0x32, runs Battle_EndVictory; otherwise sets script variable 0 to 0x32, runs Battle_EndToArea, sets g_Game.battle_order to 3." }
Boss_EndBattle = { addr = 0x800C20B0, type = "func", source = "Ends the boss battle of boss013: the battle-end hook (g_BattleEndHook) of this set, which runs Battle_ShowActorEntry(0) and Battle_ShowActorEntry(1)." }
Battle_EndVictory = { addr = 0x801DDED8, type = "func", source = "Ends the battle in victory: sets the battle phase to the result mode at step 1, which plays the victory sequence, poses the party and opens the result panel. Boss battles call it from their ending hook when the result is a victory.", alias = true }
Battle_EndToArea = { addr = 0x801DDF28, type = "func", source = "Ends the battle without a result panel: sets the battle phase to the result mode at step 3, which reloads the party sprites and the area audio and hands the scene back to its script.", alias = true }
