BMagic_MeteorStrikeInit = { addr = 0x801EED18, type = "func", source = "Centres the camera, faces the effect by the side the target selector picks, starts the meteor effect, sets STP on the palette rows the effect uses and plays the first sound." }
Effect_RequestTargetOnTimerZero = { addr = 0x801EEF3C, type = "func", source = "Counts the effect timer (byte 0x09) down; at zero asks the target selector for targets (Battle_ApplyDamageFlags with 0x10) and advances header.mode (byte 0x01) in magic226 (MeteorStrike)." }
Effect_MarkDamagedOnZeroTick = { addr = 0x801EEFA4, type = "func", source = "When the effect ticker (byte 0x0B) is zero marks the battlers of the target selector damaged, raises BATTLE_STATE_EFFECT_PLAYING and resets the effect in magic226 (MeteorStrike)." }
BMagic_DispatchEffectMode = { addr = 0x801EF004, type = "func", source = "Runs the handler that header.mode (byte 0x01) selects from the effect handlers of magic226." }
BMagic_MeteorStrikeUpdate = { addr = 0x801EF048, type = "func", source = "Runs the meteor's step and, once it has started, draws the shaded disc and the dark ring under it." }
BMagic_MeteorStrikeStart = { addr = 0x801EF10C, type = "func", source = "Places the meteor above the battler, sets its drift, tint, scale, timer and script, and steps." }
Effect_SwingCameraAngle = { addr = 0x801EF540, type = "func", source = "Swings the area camera pitch by 20 per frame, up on odd effect timer (byte 0x09) values and down on even ones; at zero resets the pitch, reloads the timer with the image's swing ticks and advances header.step (byte 0x02) in magic226 (MeteorStrike)." }
Effect_StartTint = { addr = 0x801EF5F0, type = "func", source = "Counts the effect timer (byte 0x09) down; at zero sets ACTOR_FLAG_SEMI_TRANSPARENT in header.flags, loads the tint selector (byte 0x5C) with 1, clears the tint colours (bytes 0x5D to 0x5F) and advances header.step (byte 0x02) in magic226 (MeteorStrike)." }
BMagic_MeteorStrikeEnd = { addr = 0x801EF698, type = "func", source = "Fades the meteor's tint by 8 per frame and its timer by 2; when it is dark lowers the battler's ticker and resets the effect." }
Effect_SetActiveActorMatrix = { addr = 0x801EF75C, type = "func", source = "Sets the actor's GTE matrix from its coordinates and half the vertical span of the active battler, times the camera in magic226 (MeteorStrike)." }
Effect_DrawShadedDisc = { addr = 0x801EF814, type = "func", source = "Draws a disc of 64 shaded triangles around the effect cell, its shade the timer times 4, in magic226 (MeteorStrike)." }
BMagic_DrawDarkRing = { addr = 0x801EFA64, type = "func", source = "draws 64 subtractive POLY_G4 quads in a flat ring; the inner edge subtracts four times the shade byte, the outer edge nothing" }
BMagic_MeteorStrikeSlotUpdate = { addr = 0x801EFD84, type = "func", source = "Runs the handler header.mode selects for an effect of the slot table." }
BMagic_MeteorStrikeFragmentUpdate = { addr = 0x801EFDC8, type = "func", source = "Runs the fragment's step and draws it once it has started." }
BMagic_MeteorStrikeFragmentLaunch = { addr = 0x801EFE48, type = "func", source = "After the delay places the fragment on a radius-24 ring around the battler at its angle, picks its rise speed from the ticker and waits 32 frames." }
BMagic_MeteorStrikeFragmentRise = { addr = 0x801EFF88, type = "func", source = "Moves the fragment in a circle of radius 2, arcs it in z by its velocity, and after 16 frames relaunches it with a stronger fall rate." }
BMagic_MeteorStrikeFragmentFall = { addr = 0x801F00B0, type = "func", source = "Drifts the fragment along z by its velocity and shrinks its glow; when the counter runs out lowers the battler's ticker and clears it." }
BMagic_MeteorStrikeDrawFragment = { addr = 0x801F01B8, type = "func", source = "Draws the fragment's glow as one additive textured quad whose size follows the timer and whose colour follows the glow counter." }
BMagic_MeteorStrikeRingUpdate = { addr = 0x801F04D4, type = "func", source = "Runs the ring's step and draws the ring." }
