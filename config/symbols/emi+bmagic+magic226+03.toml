BMagic_MeteorStrikeRingRise = { addr = 0x801F061C, type = "func", source = "Follows the battler in x and y, raises the ring in z by its speed and steps after 24 frames." }
BMagic_MeteorStrikeRingFade = { addr = 0x801F068C, type = "func", source = "Keeps rising while the ring's timer drops by 2; at zero lowers the battler's ticker and clears the ring." }
Effect_SetActorMatrix = { addr = 0x801F0724, type = "func", source = "Sets the actor's GTE matrix from its coordinates and half its vertical span, times the camera in magic226 (MeteorStrike)." }
BMagic_MeteorStrikeDrawRing = { addr = 0x801F07D4, type = "func", source = "Draws a ring of 32 additive quads whose inner and outer radius follow the effect counter and whose outer colour follows the timer." }
BMagic_AllocEffect = { addr = 0x801F0B8C, type = "func", source = "Claims the first free slot of the 48-entry effect table (bit 0 of header.flags) and returns its index, or 0xFF when every slot is in use in magic226 (MeteorStrike)." }
