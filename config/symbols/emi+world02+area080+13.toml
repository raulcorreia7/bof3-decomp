["emi/world02/area080/13"]
g_AreaModuleId = { addr = 0x801F2C00, source = "Module id of the area: the first payload word of its overlay, 52 + the area number." }
Area_ProjectRing = { addr = 0x801F30B0, type = "func", source = "Projects the 16 points of a glow ring onto the screen: each point lies at the ring radius around the centre, 0x100 angle units apart, and its screen position lands in the record's point row; one body shared with the other area overlays" }
Area_DrawSpark = { addr = 0x801F352C, type = "func", source = "Draws one spark slot: shifts its four origin and four position trail points one place, projects both heads, then draws the head line and a three-quad fading ribbon in the slot colour, semi-transparent; the frame pass calls it for every active slot." }
Area_SubCameraOffsetY20 = { addr = 0x801F3CE4, type = "func", source = "Subtracts 0x14 from g_AreaCameraOffsetY, the Y shift Area_SetCameraMatrix adds to the projected camera translation, and sets g_AreaCameraRefreshCount to 2 so the camera refreshes for two frames." }
Area_AddCameraOffsetY20 = { addr = 0x801F3D0C, type = "func", source = "Adds 0x14 to g_AreaCameraOffsetY, the Y shift Area_SetCameraMatrix adds to the projected camera translation, and sets g_AreaCameraRefreshCount to 2 so the camera refreshes for two frames." }
Area_ResetCameraOffsetY = { addr = 0x801F3D34, type = "func", source = "Zeroes g_AreaCameraOffsetY, the Y shift of the camera, and sets g_AreaCameraRefreshCount to 2 so the camera refreshes for two frames." }
Actor_Spawn = { addr = 0x801F3D50, type = "func", source = "Claims a free g_SpawnedActors entry, sets header.flags to 1 and type to 0x44; does nothing when no slot is free." }
