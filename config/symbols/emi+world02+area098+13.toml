["emi/world02/area098/13"]
g_MenuMasterStep = { addr = 0x801D4285, source = "Current step of the master menu (retail text Master), indexing the step handlers." }
g_MenuMasterSubStep = { addr = 0x801D4286, source = "Current sub-step of the master menu that the step handlers advance." }
g_AreaModuleId = { addr = 0x801F2C00, source = "Module id of the area: the first payload word of its overlay, 52 + the area number." }
Area_UpdateSpawn = { addr = 0x801F3AA8, type = "func", source = "Runs one frame of the spawn work: claims a slot every fourth frame of g_Self +0x06, runs the per-image AREA_SPAWN_TICK and the slot pass, decrements the timer at g_Self +0x09 and installs the pending spawn (coordinates +0x64/+0x68/+0x6C to +0x18/+0x1C/gravity, -0x1000/-0x400 into +0x0C/+0x10, spawn index +0x01 advanced) when it reaches zero (func_801F3AA8 in area098/13, func_801F3598 in area188/13)." }
GFX_DrawColorFan = { addr = 0x801F46EC, type = "func", source = "Draws a ring of 32 semi-transparent triangles around a projected point, the radius the point projected at the given size plus the frame parity, the centre corner coloured by the low three bits of the flags; one body shared by sce15ef0 and area098." }
Area_DrawYellowLine = { addr = 0x801F48E8, type = "func", source = "Draws a yellow line from one point to another: two one-pixel-offset gradient quads with the colour byte intensity on the red and green channels, then up to eight dots stepped back along the line." }
Area_FindFreeWorkRow = { addr = 0x801F4D80, type = "func", source = "Finds the first work-window row whose byte is zero or returns NULL." }
Area_ClearWorkColumn = { addr = 0x801F5240, type = "func", source = "Zeroes byte 0 of each of the 0x80 work rows, 0x14 bytes apart." }
Area_ClaimSpawnSlot = { addr = 0x801F526C, type = "func", source = "Claims the first free of the eight spawn slots at the work window: sets it active and copies the actor position, with the image's life, radius and centre shade; the area098, area172 and area188 scene steps call it every fourth frame (unk_06 & 3 == 0) before Area_UpdateSpawnSlots." }
Area_UpdateSpawnSlots = { addr = 0x801F5308, type = "func", source = "Ages every active spawn slot: counts the life byte down, shrinks the radius halfword the draw reads as the disc radius, frees the slot at zero and calls Area_DrawSpawnSlot; returns whether any slot was active, the scene steps ignore it." }
Area_DrawSpawnSlot = { addr = 0x801F53BC, type = "func", source = "Draws one spawn slot as a 32-segment fan of semi-transparent Gouraud triangles around the projected slot position (its +0x14 halfword is the radius, +0x16 the centre shade, +0x17 the rim shade)." }
Area_DrawSpinTriangle = { addr = 0x801F5580, type = "func", source = "Draws one spin-effect triangle: a gradient POLY_G3 from the record origin and its two rotated vertex offsets, shaded by the record fade; the sibling of Area_InitSpin." }
Area_InitSpin = { addr = 0x801F5820, type = "func", source = "Starts one spin-effect record: copies the actor position to the origin, rotates two opposite unit vertices by a random rotation and picks the scale; the retail sprite pass reads these fields." }
