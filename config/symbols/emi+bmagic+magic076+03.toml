Battle_MarkDamaged = { addr = 0x800A9820, alias = true, source = "Marks the selected battlers as damaged." }
Battle_ProjectRange = { addr = 0x800AF764, type = "func", source = "Projects the battle range to the screen." }
Battle_AllocEffect = { addr = 0x801E590C, alias = true }
Effect_Reset = { addr = 0x801E5988, type = "func", source = "Clears every timer, state and flag byte of the shared BattleEffect work record; every effect countdown calls it first. battle/03 owns the body.", alias = true }
g_BattleEffectBattler = { addr = 0x801EB4E0, source = "the battler the running effect acts on; Battle_UpdateEffects stores it for each effect step (emi/battle/battle/03 owns the cell)" }
g_BattleEffects = { addr = 0x801EC330, alias = true }
BMagic_EffectSteps = { addr = 0x801EEC1C, source = "Step handlers of magic076, run by header.step (byte 0x02) through Effect_DrawRings." }
Effect_PreparePalette = { addr = 0x801EEF5C, type = "func", source = "Prepares the selected battler palette fade after the effect timer reaches zero in magic076." }
Effect_BrightenPalette = { addr = 0x801EF00C, type = "func", source = "Raises the red, green and blue offsets of the palette fade entry the effect counter (byte 0x0A) names by one per frame and advances header.mode (byte 0x01) when the effect timer (byte 0x09) reaches zero in magic076." }
Effect_NextStep = { addr = 0x801EF11C, type = "func", source = "While the effect ticker (byte 0x0B) is under 1, reloads the effect timer (byte 0x09) with 8 and advances header.mode (byte 0x01) in magic076." }
Effect_DarkenPalette = { addr = 0x801EF160, type = "func", source = "Lowers the red, green and blue offsets of the palette fade entry the effect counter (byte 0x0A) names by one per frame and, when the effect timer (byte 0x09) reaches zero, frees the palette fade of the selected battle actor and advances header.mode (byte 0x01) in magic076." }
Effect_MarkDamagedOnZeroTick = { addr = 0x801EF288, type = "func", source = "When the effect ticker (byte 0x0B) is zero marks the battlers of the target selector damaged, raises BATTLE_STATE_EFFECT_PLAYING and resets the effect in magic076." }
BMagic_DispatchEffectMode = { addr = 0x801EF330, type = "func", source = "Runs the handler that header.mode (byte 0x01) selects from the effect handlers of magic076." }
Effect_CountDownAndStep = { addr = 0x801EF5F0, type = "func", source = "Counts the effect counter (byte 0x0A) down and advances header.step (byte 0x02) at zero in magic076." }
Effect_TickOnTimerZero = { addr = 0x801EF63C, type = "func", source = "Counts the effect timer (byte 0x09) down by 1 per frame; at zero lowers the ticker (byte 0x0B) of g_BattleEffectBattler and clears the effect in magic076." }
Effect_DrawRings = { addr = 0x801EF8EC, type = "func", source = "Runs the step handler header.step (byte 0x02) selects, draws the effect's two translucent ring layers and projects the battle range in magic076." }
Effect_SpreadAlongAngleAndStep = { addr = 0x801EFC30, type = "func", source = "Moves the effect outward along the angle in byte 0x0B at 2 per frame, raises it by the Z velocity, and counts byte 0x09 up by 2; at 16 advances the step." }
Effect_SpreadAlongAngleAndClear = { addr = 0x801EFD60, type = "func", source = "Moves the effect outward along the angle in byte 0x0B at 1 per frame, raises it by the Z velocity, and every other frame counts down byte 0x09; at zero decrements the battler's byte 0x0B and clears the actor." }
BMagic_DrawRingTriangles = { addr = 0x801EFEA8, type = "func", source = "draws 8 semi-transparent POLY_G3 triangles in a ring around the effect's screen point with sine and cosine offsets; one body shared with the other bmagic overlays" }
BMagic_DrawRingQuads = { addr = 0x801F00FC, type = "func", source = "draws 8 semi-transparent POLY_G4 quads in a ring around the effect's screen point with sine and cosine offsets; one body shared with the other bmagic overlays" }
BMagic_AllocEffect = { addr = 0x801F03D4, type = "func", source = "Claims the first free slot of the effect table (bit 0 of header.flags) and returns its index, or 0xFF when all 64 slots are in use in magic076." }
Actor_Clear = { addr = 0x801F0438, type = "func", source = "Clears the effect work record: header flags, mode (byte 0x01), step (byte 0x02) and bytes 0x03 and 0x04." }
g_BMagicEffectModes = { addr = 0x801F0488, source = "Handlers of magic076, run by header.mode (byte 0x01)." }
