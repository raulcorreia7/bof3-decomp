["emi/plchar/plp349/00"]
PlChar_StartTurnTeepo = { addr = 0x801CE448, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step. It is the step-table copy of Teepo, route 0 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_RunStepScriptTeepo = { addr = 0x801CE514, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script. It is the step-table copy of Teepo, route 0 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_RunPersonalAction = { addr = 0x801CE7B8, type = "func", source = "Runs the personal action's target step after the turn wait: marks the actor slot of the rock the character faces (byte 0x0A set to 1, byte 0x08 to the facing) for the action, else probes the cell ahead for a field actor and a map-cell spawn; stores the slot in work byte 0x06 and adds 2 to work byte 0x03 when a rock is found, 1 otherwise." }
PlChar_AdvancePaletteScript = { addr = 0x801CE9F4, type = "func", source = "Advances the character script by its phase in byte 0x0B: phase 1 stages the palette of byte 0x05, phase 2 selects the script of direction once Script_AnimStepOnce reports ready; ends and clears the panel mode when g_GameStateIndex is GAME_REQUEST_IDLE." }
PlChar_StartFacingScript = { addr = 0x801CEB24, type = "func", source = "Selects the script of direction once Script_AnimStepOnce reports ready and adds 1 to byte 0x03." }
PlChar_ClearSlotRefIfUnused = { addr = 0x801CEB84, type = "func", source = "When the actor slot in byte 0x06 is free or has header.mode (byte 0x01) 1 and g_AreaCameraMoving is 0, clears byte 0x06 and lowers byte 0x03 by 2." }
PlChar_SpawnLinkedActor = { addr = 0x801CEE24, type = "func", source = "Claims a free g_SpawnedActors entry for a linked character proximity actor: header.flags 1, type 0x34, header.mode from the type argument, position from the x and y arguments (16.16), z one 0x200 above the ground height and link 1." }
PlChar_UpdateLinkedFacing = { addr = 0x801CEFCC, type = "func", source = "Requests the script of direction and sets byte 0x03 to 2 once Script_AnimStepOnce reports ready; otherwise counts byte 0x0A down and at 0 copies direction and option_flags into the linked actor slot and plays SE 0x10B." }
PlChar_ClearPanelModeIfUnused = { addr = 0x801CF0EC, type = "func", source = "Clears the panel mode byte when the actor slot is unused and the camera is not moving, then runs Script_AnimStepLoop." }
PlChar_StartTurn = { addr = 0x801CF36C, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step." }
PlChar_RunStepScript = { addr = 0x801CF438, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script." }
