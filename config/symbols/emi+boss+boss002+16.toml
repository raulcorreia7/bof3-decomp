["emi/boss/boss002/16"]
Battle_ShowActorEntry = { addr = 0x800AC844, type = "func", source = "Clears the hidden flag of the actor entry entry_id, which draws the battler again.", alias = true }
Battle_CopyActorEntry = { addr = 0x800AC870, type = "func", source = "Copies a record into the actor entry entry_id: mode 0 copies its state fields and marks the entry, mode 1 copies its position.", alias = true }
Boss_EndDefeat = { addr = 0x800C1B88, type = "func", source = "Defeats the boss with Battle_DefeatEnemy (banks its EXP and Zenny, counts it off and sets BATTLE_RESULT_VICTORY for the last enemy), flags the enemy to skip its action step, unhides the actor and sets header.mode (byte 0x01) to 3 with the step cleared in boss002." }
Boss_InstallBattleHooks = { addr = 0x800C1D50, type = "func", source = "Installs the boss battle hooks of boss002: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C1D88, type = "func", source = "Handles the boss battle events of boss002: at event mode 0, when the battle is won, sets g_UIPanelMode to 2 and starts area message 0x19; always returns 0." }
Boss_ChooseBattleEnding = { addr = 0x800C1DD4, type = "func", source = "Chooses how the boss battle of boss002 ends (g_BattleChooseEndingHook). When a result bit in mask 6 is set runs func_800AC934(0), sets script variable 0 to 0x24, sets g_SndBGMId to 0x1B, runs Battle_EndVictory; otherwise runs Battle_EndDefeat." }
Boss_EndBattle = { addr = 0x800C1E34, type = "func", source = "Ends the boss battle of boss002: the battle-end hook (g_BattleEndHook) of this set, which does nothing." }
Boss_InstallBattleHooks2 = { addr = 0x800C1E3C, type = "func", source = "Installs the boss battle hooks of boss002 (set 2): Boss_ChooseBattleEnding2 into g_BattleChooseEndingHook, Boss_EndBattle2 into g_BattleEndHook and Boss_RunBattleEvent2 into g_BossBattleEventHook." }
Boss_RunBattleEvent2 = { addr = 0x800C1E74, type = "func", source = "Handles the boss battle events of boss002 (set 2): ignores every event mode and returns 0." }
Boss_ChooseBattleEnding2 = { addr = 0x800C1E7C, type = "func", source = "Chooses how the boss battle of boss002 (set 2) ends (g_BattleChooseEndingHook). When a result bit in mask 6 is set runs Battle_CopyActorEntry(0, (PartyMember*)g_BattleEnemyBattlers, 0), sets script variable 0 to 0x6D, sets g_SndBGMId to 0x18, runs Battle_EndVictory; otherwise runs Battle_EndDefeat." }
Boss_EndBattle2 = { addr = 0x800C1EE8, type = "func", source = "Ends the boss battle of boss002 (set 2): the battle-end hook (g_BattleEndHook) of this set, which runs Battle_ShowActorEntry(0)." }
Boss_InstallBattleHooks3 = { addr = 0x800C1F08, type = "func", source = "Installs the boss battle hooks of boss002 (set 3): Boss_ChooseBattleEnding3 into g_BattleChooseEndingHook, Boss_EndBattle3 into g_BattleEndHook and Boss_RunBattleEvent3 into g_BossBattleEventHook." }
Boss_RunBattleEvent3 = { addr = 0x800C1F40, type = "func", source = "Handles the boss battle events of boss002 (set 3): ignores every event mode and returns 0." }
Boss_ChooseBattleEnding3 = { addr = 0x800C1F48, type = "func", source = "Chooses how the boss battle of boss002 (set 3) ends (g_BattleChooseEndingHook). On victory sets g_ScenarioState.step_05 to 5, runs Battle_EndVictory; otherwise runs Battle_EndDefeat." }
Boss_EndBattle3 = { addr = 0x800C1F94, type = "func", source = "Ends the boss battle of boss002 (set 3): the battle-end hook (g_BattleEndHook) of this set, which does nothing." }
Battle_EndVictory = { addr = 0x801DDED8, type = "func", source = "Ends the battle in victory: sets the battle phase to the result mode at step 1, which plays the victory sequence, poses the party and opens the result panel. Boss battles call it from their ending hook when the result is a victory.", alias = true }
Battle_EndDefeat = { addr = 0x801DDF00, type = "func", source = "Ends the battle in defeat: sets the battle phase to the result mode at step 2, which plays the defeat sequence and shows the defeat message. Boss battles call it from their ending hook when the result is not a victory.", alias = true }
