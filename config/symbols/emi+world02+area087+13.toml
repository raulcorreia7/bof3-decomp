["emi/world02/area087/13"]
g_AreaModuleId = { addr = 0x801F2C00, source = "Module id of the area: the first payload word of its overlay, 52 + the area number." }
UI_MessageClearOnCancel = { addr = 0x801F2C04, type = "func", source = "Sets g_SceneEventStep to 2 when the menu selection is idle, and clears the message request." }
Actor_ZoomIn = { addr = 0x801F3258, type = "func", source = "Grows the actor scale at offset 0x40 by 0x2000 each frame and sets header.mode (byte 0x01) to 3 when the timer at byte 0x09 expires." }
Area_RequestRestartOnEntryChange = { addr = 0x801F32D4, type = "func", source = "Outside game entry state 1, when the step byte 0x0B no longer matches option_flags, an area change is requested, or a step-1 actor no longer matches g_GameEntryAreaId, arms the restart: byte 0x48 to 2, timer to 8, header.mode to 4." }
Actor_ZoomOut = { addr = 0x801F3394, type = "func", source = "Centres the actor on the screen and shrinks the scale at +0x40 by 0x2000 each frame; when the timer at byte 0x09 reaches 0 it frees the actor if g_GameStateIndex is GAME_REQUEST_AREA_CHANGE, otherwise it clears byte 0x48 and sets header.mode (byte 0x01) to 1." }
Actor_SetScreenOrigin = { addr = 0x801F3434, type = "func", source = "Sets the actor screen_x to 0xA0 and screen_y to 0x50." }
Actor_NextStep = { addr = 0x801F3494, type = "func", source = "Zeroes the work bytes 0x09 and 0x0B and adds 1 to header.mode (byte 0x01)." }
Actor_SlideScreenLeft = { addr = 0x801F3540, type = "func", source = "Sets the actor screen_x to -0x30 and adds 1 to header.step (byte 0x02), when D_801454F2 is not 2 and no script is active." }
Actor_SlideScreenX = { addr = 0x801F3590, type = "func", source = "Adds ACTOR_SCREEN_X_STEP to the screen origin of the work record and, once it reaches ACTOR_SCREEN_X_THRESHOLD, adds 1 to the step (byte 0x02); runs Area_Update." }
Area_Update = { addr = 0x801F35EC, type = "func", source = "Sets header.step (byte 0x02) to 3 when D_801454F2 is 2, then draws the area HUD at the actor screen_x with Area_DrawHud." }
Area_SlideHudBannerLeft = { addr = 0x801F363C, type = "func", source = "Moves the HUD banner screen_x 16 pixels left per frame and sets header.step (byte 0x02) to 0 below -47; sets it to 1 when D_801454F2 is not 2; draws HUD record 0x10 at the banner x." }
Actor_SetScreenBottom = { addr = 0x801F3704, type = "func", source = "Sets the actor screen_y to 0xF0 and adds 1 to byte 0x03, when D_801454F2 is 0 or byte 0x0B is 0, no message is requested and no script is active." }
Area_RaiseHudBanner = { addr = 0x801F3784, type = "func", source = "Moves the HUD banner screen_y 10 units up per frame and adds 1 to byte 0x03 below y 201; D_801454F2 with the flag at byte 0x0B, a message request or an active script set byte 0x03 to 3; draws banner record 0x5C at screen_y." }
Area_CountHudBannerHold = { addr = 0x801F385C, type = "func", source = "Counts the hold timer up to 90 frames and then sets the flag at byte 0x0B; with D_801454F2 set and that flag, a message request or an active script it adds 1 to byte 0x03; draws banner record 0x5C at screen_y." }
Area_StepHudBannerDown = { addr = 0x801F395C, type = "func", source = "Moves the HUD banner screen_y 10 units down per frame and zeroes byte 0x03 from y 240; without D_801454F2, a message request or an active script it sets byte 0x03 to 1; draws banner record 0x5C at screen_y." }
Area_DrawHudSprite = { addr = 0x801F3A0C, type = "func", source = "Draws one sprite at (x, y) from the four-byte (w, h, u0, v0) cell selected by sprite_id, clut WORLD_SPRITE_CLUT; Area_DrawHud calls it with ids 0 to 3 and the WorldMapMarker step." }
Area_DrawHud = { addr = 0x801F3B34, type = "func", source = "Draws the area HUD at (x, y) when a g_AreaDrawFlags draw bit is set: sprite 0, then the button sprite of the WorldMapMarker matching g_InputMasks[FIELD_INPUT_INTERACT] at y + 8 and the one matching g_InputMasks[FIELD_INPUT_PERSONAL_ACTION] at y + 0x10, sprite 3 when the target cell or walk flags block, and Area_DrawGradientDiamond at (x + 0x18, y + 0x18)." }
Area_DrawGradientDiamond = { addr = 0x801F3F00, type = "func", source = "Builds the diamond (-10,0), (0,-4), (0,4), (10,0), turns it by g_AreaCameraAngle, projects it and queues one POLY_G4 at (x - 0x9E, y - 0x76); Area_DrawHud calls it with its x and y plus 0x18." }
Area_DrawHudBanner = { addr = 0x801F40F8, type = "func", source = "Draws the HUD banner when a draw flag is set: banner sprites 4 and 5 at x and x+0x80 and the title text at the offset in the first halfword of the executable text bank." }
Actor_SpawnFlock = { addr = 0x801F41EC, type = "func", source = "Every 1024 frames, spawns a flock of up to three actors (type 0x16) at the focus point, 0x400 above the ground, with one random facing of four." }
Actor_StartFlying = { addr = 0x801F4328, type = "func", source = "Gives each flock member a velocity from its facing and backs it off along it so the flock enters from out of view, members 1 and 2 two cells to either side; selects the script for that facing. Step after Actor_SpawnFlock; Actor_Fly follows." }
Actor_Fly = { addr = 0x801F4558, type = "func", source = "Flies the flock member by its velocity each frame and runs the area projection; frees it once header.flags bit 0x80 is set after it was seen clear (it has left the screen)." }
Area_StepStreamSetDrawMode = { addr = 0x801F4770, type = "func", source = "Calls Actor_StepAnimLoop, which counts the work record's delay byte down and advances its stream at zero, then Area_SetDrawMode, which stages g_AreaDrawMode into the work record." }
WorldMap_UpdateClouds = { addr = 0x801F4798, type = "func", source = "Drifts the cloud layer picked by the work row down the map and draws it over the map cells around it, with this image's tables of texture origin and cell size per layer." }
g_FlockVelocity = { addr = 0x801F57EC, source = "Velocity per facing of the world map flock (x, y), read by Actor_StartFlying." }
g_FlockScript = { addr = 0x801F57FC, source = "Script and script slot per facing of the world map flock, two bytes each; read by Actor_StartFlying." }
g_WorldMapCloudTexture = { addr = 0x801F580C, source = "Texture window of the cloud layer per layer width: u origins, v origins, then cell sizes, 4 bytes each; read by WorldMap_UpdateClouds." }
