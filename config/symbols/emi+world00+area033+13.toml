["emi/world00/area033/13"]
g_AreaModuleId = { addr = 0x801F2C00, source = "Module id of the area: the first payload word of its overlay, 52 + the area number." }
Message_ClearOnCancel = { addr = 0x801F2C04, type = "func", source = "Sets g_SceneEventStep to 2 when the menu selection is idle, and clears the message request." }
Actor_ZoomIn = { addr = 0x801F3158, type = "func", source = "Centres the actor, grows the scale at offset 0x40 by 0x2000 each frame and counts the timer at byte 0x09 down; when it reaches 0 it clears byte 0x48 and sets header.mode (byte 0x01) to 3." }
Area_RequestRestartOnEntryChange = { addr = 0x801F31D4, type = "func", source = "Outside game entry state 1, when the step byte 0x0B no longer matches option_flags, an area change is requested, or a step-1 actor no longer matches g_GameEntryAreaId, arms the restart: byte 0x48 to 2, timer to 8, header.mode to 4." }
Actor_ZoomOut = { addr = 0x801F3294, type = "func", source = "Centres the actor on the screen and shrinks the scale at +0x40 by 0x2000 each frame; when the timer at byte 0x09 reaches 0 it frees the actor if g_GameStateIndex is GAME_REQUEST_AREA_CHANGE, otherwise it clears byte 0x48 and sets header.mode (byte 0x01) to 1." }
Actor_SetScreenOrigin = { addr = 0x801F3334, type = "func", source = "Sets the actor screen_x to 0xA0 and screen_y to 0x50." }
Actor_NextStep = { addr = 0x801F3394, type = "func", source = "Zeroes the work bytes 0x09 and 0x0B and adds 1 to header.mode (byte 0x01)." }
Actor_SlideScreenLeft = { addr = 0x801F3440, type = "func", source = "Sets the actor screen_x to -0x30 and adds 1 to header.step (byte 0x02), when D_801454F2 is not 2 and no script is active." }
Actor_SlideScreenX = { addr = 0x801F3490, type = "func", source = "Adds ACTOR_SCREEN_X_STEP to the screen origin of the work record and, once it reaches ACTOR_SCREEN_X_THRESHOLD, adds 1 to the step (byte 0x02); runs Area_Update." }
Area_Update = { addr = 0x801F34EC, type = "func", source = "Sets header.step (byte 0x02) to 3 when D_801454F2 is 2, then draws the area HUD at the actor screen_x with Area_DrawHud." }
Area_SlideHudBannerLeft = { addr = 0x801F353C, type = "func", source = "Moves the HUD banner screen_x 16 pixels left per frame and sets header.step (byte 0x02) to 0 below -47; sets it to 1 when D_801454F2 is not 2; draws HUD record 0x10 at the banner x." }
Actor_SetScreenBottom = { addr = 0x801F3604, type = "func", source = "Sets the actor screen_y to 0xF0 and adds 1 to byte 0x03, when D_801454F2 is 0 or byte 0x0B is 0, no message is requested and no script is active." }
Area_DrawHudSprite = { addr = 0x801F390C, type = "func", source = "Draws one sprite at (x, y) from the four-byte (w, h, u0, v0) cell selected by sprite_id, clut WORLD_SPRITE_CLUT; Area_DrawHud calls it with ids 0 to 3 and the WorldMapMarker step." }
Area_DrawHud = { addr = 0x801F3A34, type = "func", source = "Draws the area HUD at (x, y) when a g_AreaDrawFlags draw bit is set: sprite 0, then the button sprite of the WorldMapMarker matching g_InputMasks[FIELD_INPUT_INTERACT] at y + 8 and the one matching g_InputMasks[FIELD_INPUT_PERSONAL_ACTION] at y + 0x10, sprite 3 when the target cell or walk flags block, and Area_DrawGradientDiamond at (x + 0x18, y + 0x18)." }
Area_DrawGradientDiamond = { addr = 0x801F3E00, type = "func", source = "Builds the diamond (-10,0), (0,-4), (0,4), (10,0), turns it by g_AreaCameraAngle, projects it and queues one POLY_G4 at (x - 0x9E, y - 0x76); Area_DrawHud calls it with its x and y plus 0x18." }
Actor_SpawnFlock = { addr = 0x801F40F0, type = "func", source = "Every 1024 frames, spawns a flock of up to three actors (type 0x16) at the focus point, 0x400 above the ground, with one random facing of four." }
Actor_StartFlying = { addr = 0x801F422C, type = "func", source = "Gives each flock member a velocity from its facing and backs it off along it so the flock enters from out of view, members 1 and 2 two cells to either side; selects the script for that facing. Step after Actor_SpawnFlock; Actor_Fly follows." }
Actor_Fly = { addr = 0x801F445C, type = "func", source = "same body as emi/world00/area016/13@0x801F4528 Actor_Fly" }
Area_StepStreamSetDrawMode = { addr = 0x801F4674, type = "func", source = "Calls Actor_StepAnimLoop, which counts the work record's delay byte down and advances its stream at zero, then Area_SetDrawMode, which stages g_AreaDrawMode into the work record." }
WorldMap_UpdateClouds = { addr = 0x801F469C, type = "func", source = "Drifts the cloud layer picked by the work row down the map and draws it over the map cells around it, with this image's tables of texture origin and cell size per layer." }
g_FlockVelocity = { addr = 0x801F501C, source = "Velocity per facing of the world map flock (x, y), read by Actor_StartFlying." }
g_FlockScript = { addr = 0x801F502C, source = "Script and script slot per facing of the world map flock, two bytes each; read by Actor_StartFlying." }
g_WorldMapCloudTexture = { addr = 0x801F503C, source = "Texture window of the cloud layer per layer width: u origins, v origins, then cell sizes, 4 bytes each; read by WorldMap_UpdateClouds." }
