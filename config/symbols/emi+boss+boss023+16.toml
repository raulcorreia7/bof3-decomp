["emi/boss/boss023/16"]
Boss_InstallBattleHooks = { addr = 0x800C1984, type = "func", source = "Installs the boss battle hooks of boss023: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C19BC, type = "func", source = "Handles the boss battle events of boss023: ignores every event mode and returns 0." }
Boss_ChooseBattleEnding = { addr = 0x800C19C4, type = "func", source = "Chooses how the boss battle of boss023 ends (g_BattleChooseEndingHook). On victory sets script variable 0 to 0x0A, runs Battle_EndVictory; otherwise runs Battle_EndDefeat." }
Boss_EndBattle = { addr = 0x800C1A10, type = "func", source = "Ends the boss battle of boss023 (g_BattleEndHook): runs func_800AC934 for battle slots 0, 1 and 2." }
