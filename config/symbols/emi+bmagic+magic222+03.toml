["emi/bmagic/magic222/03"]
Battle_MarkDamaged = { addr = 0x800A9820, alias = true, source = "Marks the selected battlers as damaged." }
Battle_ProjectRange = { addr = 0x800AF764, type = "func", source = "Projects the battle range to the screen." }
Battle_CenterCamera = { addr = 0x800AFD9C, alias = true }
Battle_AllocEffect = { addr = 0x801E590C, alias = true, source = "Claims a free battle effect slot." }
Effect_Reset = { addr = 0x801E5988, type = "func", source = "Clears every timer, state and flag byte of the shared BattleEffect work record; every effect countdown calls it first. battle/03 owns the body." }
g_BattleEffectBattler = { addr = 0x801EB4E0, source = "the battler the running effect acts on; Battle_UpdateEffects stores it for each effect step (emi/battle/battle/03 owns the cell)" }
g_BattleEffects = { addr = 0x801EC330, alias = true, source = "Battle effect work records (stride 0x78); Battle_AllocEffect claims a free one by setting bit 0 of header.flags." }
BMagic_DispatchMode = { addr = 0x801EEC10, type = "func", source = "Runs the handler that header.mode (byte 0x01) selects from the module head's three callbacks in magic222 (Combustion)." }
BMagic_CombustionInit = { addr = 0x801EEC70, type = "func", source = "Centres the camera, projects the range, starts the shadow and the actor effects with a delay of 16 each, counts both as live, and sets STP on the battle overlay and bmagic palette rows keeping colour 0 of each." }
Effect_CountDownTimerQueueEffect = { addr = 0x801EEE20, type = "func", source = "Counts the counter (byte 0x09) down; at zero queues the selection sound (0x100) and advances header.mode (byte 0x01) in magic222 (Combustion)." }
Effect_MarkDamagedOnZeroTick = { addr = 0x801EEE80, type = "func", source = "When the live-effect count (byte 0x0B) is zero marks the battlers of the target selector damaged, raises BATTLE_STATE_EFFECT_PLAYING and resets the effect in magic222 (Combustion)." }
BMagic_DispatchEffectMode = { addr = 0x801EEEE0, type = "func", source = "Runs the handler that header.mode (byte 0x01) selects from the effect handlers of magic222." }
BMagic_CombustionActorUpdate = { addr = 0x801EEF24, type = "func", source = "Runs the actor's step under the bmagic script table and, once started, projects the range and adds the grid actor." }
BMagic_CombustionActorPlace = { addr = 0x801EEFC8, type = "func", source = "Counts the delay (counter, byte 0x09) down; at zero places the actor 0x780 above the effect battler with a fall speed of 96, selects script 0, sets scale 1.0, loads the counter with 16 and steps." }
BMagic_CombustionActorFall = { addr = 0x801EF148, type = "func", source = "Lowers the actor by its fall speed per frame; when the counter reaches zero plays the sound, starts eight spark effects on the effect battler (index 0 to 7, each counted as live), tilts the camera pitch up by 20 and loads the counter with 8." }
Effect_SwingCameraAngle = { addr = 0x801EF274, type = "func", source = "Swings the area camera pitch by 20 per frame, up on odd counter (byte 0x09) values and down on even ones; at zero resets the pitch, reloads the counter with the image's swing ticks and advances header.step (byte 0x02) in magic222 (Combustion)." }
BMagic_CombustionActorSpawnWave = { addr = 0x801EF324, type = "func", source = "Counts the counter down; at zero plays the sound, starts the wave effect on the effect battler and counts it as live, makes the actor semi-transparent with tint selector 1 and shade 0x40 and loads the counter with 12." }
Effect_StartTint = { addr = 0x801EF448, type = "func", source = "Counts the counter (byte 0x09) down; at zero sets ACTOR_FLAG_SEMI_TRANSPARENT in header.flags, loads the tint selector (byte 0x5C) with 1, clears the tint colours (bytes 0x5D to 0x5F) and advances header.step (byte 0x02) in magic222 (Combustion)." }
BMagic_CombustionActorFade = { addr = 0x801EF4F0, type = "func", source = "Lowers the three tint shades by 0x10 and widens the actor by 0x1800 per frame; once the shade has fallen to -0x80 lowers the effect battler's live-effect count and resets the effect." }
BMagic_CombustionShadowUpdate = { addr = 0x801EF5A4, type = "func", source = "Runs the shadow's step and, once started, sets the actor matrix and draws the dark disc and the dark ring." }
BMagic_CombustionShadowPlace = { addr = 0x801EF634, type = "func", source = "Counts the delay (counter) down; at zero places the shadow at the effect battler, clears its radius and counter, sets the timer to 38 and steps." }
BMagic_CombustionShadowGrow = { addr = 0x801EF6C8, type = "func", source = "Raises the counter by 1 and the radius by 6 per frame; steps when the counter is 16." }
Effect_CountDownAndStep = { addr = 0x801EF724, type = "func", source = "Counts the timer (byte 0x0A) down and advances header.step (byte 0x02) at zero in magic222 (Combustion)." }
Effect_TickOnTimerZero = { addr = 0x801EF770, type = "func", source = "Counts the counter (byte 0x09) down by 1 per frame; at zero lowers the live-effect count (byte 0x0B) of battler g_BattleEffectBattler and clears the effect in magic222 (Combustion)." }
Effect_SetActorMatrix = { addr = 0x801EF7CC, type = "func", source = "Sets the actor's GTE matrix from its coordinates and half its vertical span, times the camera in magic222 (Combustion)." }
BMagic_CombustionDrawShadow = { addr = 0x801EF87C, type = "func", source = "Draws a disc of 64 subtractive triangles of the shadow's radius, shaded by the counter times 4." }
BMagic_DrawDarkRing = { addr = 0x801EFACC, type = "func", source = "draws 64 subtractive POLY_G4 quads in a flat ring; the inner edge subtracts four times the shade byte, the outer edge nothing" }
BMagic_CombustionSparkUpdate = { addr = 0x801EFDEC, type = "func", source = "Runs the spark's step and, once started, draws it in its own matrix." }
BMagic_CombustionSparkPlace = { addr = 0x801EFE74, type = "func", source = "Places the spark at a random distance of 8 to 15 from the effect battler, at the angle its index (byte 0x0B) gives, an eighth of a turn each, and loads the counter with 8 and the timer with 16." }
BMagic_CombustionSparkFly = { addr = 0x801EFF7C, type = "func", source = "Moves the spark 1 further out per frame; steps once the counter has counted down to zero." }
BMagic_CombustionSparkEnd = { addr = 0x801F0070, type = "func", source = "Moves the spark 1 further out per frame; once the timer has counted down to zero lowers the effect battler's live-effect count and resets the effect." }
Effect_SetActorMatrix3 = { addr = 0x801F0168, type = "func", source = "Sets the actor's GTE matrix from its coordinates and half its vertical span, times the camera in magic222 (Combustion)." }
BMagic_CombustionDrawSpark = { addr = 0x801F0218, type = "func", source = "Draws a textured additive square round the spark, 0x100 from its centre to a corner, shaded by the timer times 8." }
BMagic_CombustionWaveUpdate = { addr = 0x801F0504, type = "func", source = "Runs the wave's step and, once started, draws the wave twice." }
BMagic_CombustionWavePlace = { addr = 0x801F0584, type = "func", source = "Takes the effect battler's screen point, applies damage flag 0x10 to the target selector, loads the wave radius (byte 0x0B) with 8, the counter with 0 and the timer with 4, and steps." }
Effect_CountUpByTwoAndStep = { addr = 0x801F061C, type = "func", source = "Counts the counter (byte 0x09) up by two and advances header.step (byte 0x02) at 16 in magic222 (Combustion)." }
BMagic_CombustionWaveWait = { addr = 0x801F066C, type = "func", source = "Counts the timer down; at zero loads it with 16 and steps." }
BMagic_CombustionWaveRise = { addr = 0x801F06C8, type = "func", source = "Raises the wave radius by 4 per frame and counts the timer down; steps at zero." }
BMagic_CombustionWaveEnd = { addr = 0x801F0730, type = "func", source = "Raises the wave radius by 4 per frame and counts the counter down; at zero lowers the active battler's live-effect count and resets the effect." }
BMagic_CombustionDrawWave = { addr = 0x801F07A8, type = "func", source = "Draws 32 columns 16 wide from 0x100 left of the effect point, each of four additive quads, two above the row and two mirrored below, their heights following rsin over the column with the wave radius and twice it, shaded by the counter." }
g_BMagicEffectModes = { addr = 0x801F0D54, source = "Handlers of magic222 (Combustion), run by header.mode (byte 0x01)." }
g_BMagicCombustionActorSteps = { addr = 0x801F0D64, source = "The six steps of the actor: place, fall, swing the camera, spawn the wave, tint, fade." }
g_BMagicCombustionShadowSteps = { addr = 0x801F0D7C, source = "The four steps of the shadow: place, grow, hold, end." }
g_BMagicCombustionSparkSteps = { addr = 0x801F0D8C, source = "The three steps of a spark: place, fly, end." }
g_BMagicCombustionWaveSteps = { addr = 0x801F0D98, source = "The five steps of the wave: place, count up, wait, rise, end." }
