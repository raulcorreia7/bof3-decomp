["emi/boss/boss036/16"]
Boss_InstallBattleHooks = { addr = 0x800C1D78, type = "func", source = "Installs the boss battle hooks of boss036: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C1DB0, type = "func", source = "Handles the boss battle events of boss036: ignores every event mode and returns 0." }
Boss_ChooseBattleEnding = { addr = 0x800C1DB8, type = "func", source = "Chooses how the boss battle of boss036 ends (g_BattleChooseEndingHook). On victory sets g_ScenarioState.step_05 to 8, runs Battle_EndVictory; otherwise runs Battle_EndDefeat." }
Boss_EndBattle = { addr = 0x800C1E04, type = "func", source = "Ends the boss battle of boss036: the battle-end hook (g_BattleEndHook) of this set, which does nothing." }
Boss_InstallBattleHooks2 = { addr = 0x800C1E0C, type = "func", source = "Installs the boss battle hooks of boss036 (set 2): Boss_ChooseBattleEnding2 into g_BattleChooseEndingHook, Boss_EndBattle2 into g_BattleEndHook and Boss_RunBattleEvent2 into g_BossBattleEventHook." }
Boss_RunBattleEvent2 = { addr = 0x800C1E44, type = "func", source = "Handles the boss battle events of boss036 (set 2): ignores every event mode and returns 0." }
Boss_ChooseBattleEnding2 = { addr = 0x800C1E4C, type = "func", source = "Chooses how the boss battle of boss036 (set 2) ends (g_BattleChooseEndingHook). On victory sets g_ScenarioState.step_05 to 5, runs Battle_EndVictory; otherwise runs Battle_EndDefeat." }
Boss_EndBattle2 = { addr = 0x800C1E98, type = "func", source = "Ends the boss battle of boss036 (set 2): the battle-end hook (g_BattleEndHook) of this set, which does nothing." }
Boss_RunSubStep = { addr = 0x800C1EE4, type = "func", source = "Runs the sub-step handler that the actor step byte (byte 0x02) selects from the three callbacks at D_800C1804 in boss036." }
Effect_AddActor = { addr = 0x800C1FA4, type = "func", source = "Adds the effect's actor and advances header.step (byte 0x02) once BATTLE_STATE_EFFECT_PLAYING is set." }
Battle_EndVictory = { addr = 0x801DDED8, type = "func", source = "Ends the battle in victory: sets the battle phase to the result mode at step 1, which plays the victory sequence, poses the party and opens the result panel. Boss battles call it from their ending hook when the result is a victory.", alias = true }
Battle_EndDefeat = { addr = 0x801DDF00, type = "func", source = "Ends the battle in defeat: sets the battle phase to the result mode at step 2, which plays the defeat sequence and shows the defeat message. Boss battles call it from their ending hook when the result is not a victory.", alias = true }
Battle_RequestEnemyScript = { addr = 0x801E2314, type = "func", source = "Requests the script at index script_index of the current enemy (g_BattleCurrentEnemy) for the task actor, by its facing; bit 0x80 of the script byte sets the actor flag unk_2A.", alias = true }
