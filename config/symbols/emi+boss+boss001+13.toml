["emi/boss/boss001/13"]
Battle_ShowActorEntry = { addr = 0x800AC844, type = "func", source = "Clears the hidden flag of the actor entry entry_id, which draws the battler again.", alias = true }
Battle_CopyActorEntry = { addr = 0x800AC870, type = "func", source = "Copies a record into the actor entry entry_id: mode 0 copies its state fields and marks the entry, mode 1 copies its position.", alias = true }
jtbl_800C1804 = { addr = 0x800C1804, type = "Callback", size = 0x1C, source = "The switch table of Boss_RunBattleEvent: 7 jump targets of its jr dispatch." }
Boss_EndDefeat2 = { addr = 0x800C1900, type = "func", source = "Defeats the boss with Battle_DefeatEnemy (banks its EXP and Zenny, counts it off and sets BATTLE_RESULT_VICTORY for the last enemy), flags the enemy to skip its action step, unhides the actor and sets header.mode (byte 0x01) to 3 with the step cleared in boss001." }
Boss_EndDefeat = { addr = 0x800C1C20, type = "func", source = "Defeats the boss with Battle_DefeatEnemy (banks its EXP and Zenny, counts it off and sets BATTLE_RESULT_VICTORY for the last enemy), flags the enemy to skip its action step, unhides the actor and sets header.mode (byte 0x01) to 3 with the step cleared in boss001." }
Boss_InstallBattleHooks = { addr = 0x800C1E50, type = "func", source = "Installs the boss battle hooks of boss001: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C1E88, type = "func", source = "Handles the boss battle events of boss001: g_BossBattleEventHook calls it with the event mode (0 to 6) from the battle loop and tests its u8 result." }
Boss_ChooseBattleEnding = { addr = 0x800C1FF8, type = "func", source = "Chooses how the boss battle of boss001 ends (g_BattleChooseEndingHook). On defeat sets g_ScenarioState.state_04 to 6 and step_05 to 0x32; otherwise advances g_ScenarioState.step_05. Then runs Battle_EndToArea." }
Boss_EndBattle = { addr = 0x800C2060, type = "func", source = "Ends the boss battle of boss001 (g_BattleEndHook): for each of battle slots 6 and 7 runs Battle_ShowActorEntry and Battle_CopyActorEntry on the matching enemy battler, takes the actor func_800AC754 returns, finds scene record 0x5F, clears work bytes 0x2A and 0x48, selects script 1 for slot 6 and script 0 for slot 7, and copies the halfwords at bytes 0x58 and 0x5A of that enemy battler into it." }
Battle_EndToArea = { addr = 0x801DDF28, type = "func", source = "Ends the battle without a result panel: sets the battle phase to the result mode at step 3, which reloads the party sprites and the area audio and hands the scene back to its script.", alias = true }
Battle_RequestEnemyScript = { addr = 0x801E2314, type = "func", source = "Requests the script at index script_index of the current enemy (g_BattleCurrentEnemy) for the task actor, by its facing; bit 0x80 of the script byte sets the actor flag unk_2A.", alias = true }
