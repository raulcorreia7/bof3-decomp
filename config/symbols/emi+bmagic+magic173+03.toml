Battle_ApplyDamageFlags = { addr = 0x800A9610, alias = true }
Battle_MarkDamaged = { addr = 0x800A9820, alias = true, source = "Marks the selected battlers as damaged." }
Battle_StepRangeToward = { addr = 0x800AF3A0, type = "func", source = "Moves the battle range one step toward a point: the range's x and y axes and its vertical span each move by the step along the unit direction to the point. battle/15 owns the body." }
Battle_ProjectRange = { addr = 0x800AF764, type = "func", source = "Projects the battle range to the screen." }
Effect_RotatePosition = { addr = 0x801DD350, type = "func", source = "Integrates the effect velocity pairs the effect steps read; battle/03 owns the body." }
Battle_AllocEffect = { addr = 0x801E590C, alias = true, source = "Claims a free battle effect slot." }
Effect_Reset = { addr = 0x801E5988, type = "func", source = "Clears every timer, state and flag byte of the shared BattleEffect work record; every effect countdown calls it first. battle/03 owns the body.", alias = true }
g_BattleEffectBattler = { addr = 0x801EB4E0, source = "the battler the running effect acts on; Battle_UpdateEffects stores it for each effect step (emi/battle/battle/03 owns the cell)" }
g_BattleEnemyBattlers = { addr = 0x801EB630, alias = true }
g_BattleEffects = { addr = 0x801EC330, alias = true, source = "Battle effect work records (stride 0x78); Battle_AllocEffect claims a free one by setting bit 0 of header.flags." }
BMagic_IntimidateUpdate = { addr = 0x801EEC04, type = "func", source = "The module entry: runs the init (mode 0) or Effect_MarkDamagedOnZeroTick (mode 1)." }
BMagic_IntimidateInit = { addr = 0x801EEC5C, type = "func", source = "Copies the effect battler's facing and position into the task, starts two streak effects (id 24, mode 0, index 0 and 1 in unk_04), sets the live-effect count (byte 0x0B) to 2, copies the battle overlay palette row from the area's palette arena into its copy, flags the palette pending, plays the sound and advances header.mode." }
Effect_MarkDamagedOnZeroTick = { addr = 0x801EED90, type = "func", source = "When the live-effect count (byte 0x0B) is zero marks the battlers of the target selector damaged, raises BATTLE_STATE_EFFECT_PLAYING and resets the effect in magic173 (Intimidate)." }
BMagic_DispatchEffectMode = { addr = 0x801EEDF0, type = "func", source = "Runs the handler that header.mode (byte 0x01) selects from the effect handlers of magic173." }
BMagic_IntimidateStreakUpdate = { addr = 0x801EEE34, type = "func", source = "Runs the streak's step and, once it is alive and past step 0, draws the narrow ribbon for index 1 or the wide ribbon for index 0." }
BMagic_IntimidateStreakPlace = { addr = 0x801EEEEC, type = "func", source = "Offsets the streak's start from the effect battler by character or by enemy type (0x61 and 0x6C have their own offsets), rotates it by the facing, aims it at the selected actor, seeds the first two trail points at its screen position, sets the counter (byte 0x09) to 16 and the trail end (timer, byte 0x0A) to 1 and steps." }
BMagic_IntimidateStreakFly = { addr = 0x801EF148, type = "func", source = "Grows the trail end up to 8, moves 0xC0 toward the selected actor and, within 0x8000 of it or once the heading has turned 0x601 to 0x9FF past it, snaps onto the actor and steps; records the trail, applies damage flags 0x10 to the target selector from index 0 after the first step, and on arrival starts an impact effect (id 24, mode 1) there and raises the live-effect count." }
BMagic_IntimidateStreakSlide = { addr = 0x801EF3D8, type = "func", source = "While the trail end is below 8, moves the first drawn point (byte 0x0B) and the end on one point per frame and records the trail; at 8 sets the counter to 8 and steps." }
Effect_EndTrail = { addr = 0x801EF484, type = "func", source = "Clears the trail, counts the timer down, and finishes the effect at zero." }
BMagic_IntimidateDrawStreakNarrow = { addr = 0x801EF4EC, type = "func", source = "Draws the trail as a ribbon of POLY_G4 quads two units either side of each segment heading, from the first drawn point (byte 0x0B) to the trail end (timer, byte 0x0A), the shade falling by 12 per segment." }
BMagic_IntimidateDrawStreakWide = { addr = 0x801EFA34, type = "func", source = "Draws the trail as a ribbon twelve units either side of the centreline in two passes, one side each: the outer edge near black, the centreline shaded 0x61 falling by 12 per segment on one side and 0x81 falling by 16 on the other." }
Effect_RecordTrail = { addr = 0x801F02B0, type = "func", source = "Records the current battle magic trail position." }
Effect_ClearTrail = { addr = 0x801F03A0, type = "func", source = "Clears the current battle magic trail slot." }
BMagic_IntimidateImpactUpdate = { addr = 0x801F0488, type = "func", source = "Runs the impact's step under the bmagic script table and, while it is alive, projects it, draws the burst and, before step 3, adds the grid actor." }
BMagic_IntimidateImpactPlace = { addr = 0x801F0540, type = "func", source = "Sets the impact's actor fields, selects script 0, clears the counter (byte 0x09) and steps." }
BMagic_IntimidateImpactRise = { addr = 0x801F0648, type = "func", source = "Plays the script one step and raises the counter by 4 per frame; at 16, after 4 frames, steps." }
BMagic_IntimidateImpactPlay = { addr = 0x801F06B0, type = "func", source = "Plays the script until it ends and steps." }
Effect_TickOnTimerZero = { addr = 0x801F0700, type = "func", source = "Counts the counter (byte 0x09) down by 4 per frame; at zero lowers the live-effect count (byte 0x0B) of battler g_BattleEffectBattler and clears the effect in magic173 (Intimidate)." }
BMagic_IntimidateDrawImpactBurst = { addr = 0x801F075C, type = "func", source = "Draws a fan of 8 triangles of radius 28 to 31 (random) round the screen position, the centre shaded by the counter times 6 and the rim near black." }
g_BMagicEffectModes = { addr = 0x801F0988, source = "Handlers of magic173 (Intimidate), run by header.mode (byte 0x01)." }
g_BMagicIntimidateStreakSteps = { addr = 0x801F0990, source = "The steps of a streak by header.step: place, fly, slide, end the trail." }
g_BMagicIntimidateImpactSteps = { addr = 0x801F09A0, source = "The steps of an impact by header.step: place, rise, play, count the counter down." }
BMagic_Trail = { addr = 0x801F09B0, source = "Trail position buffer for magic173, shifted by BMAGIC_SHIFT_TRAIL." }
