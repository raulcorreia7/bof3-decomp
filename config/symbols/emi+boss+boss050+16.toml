["emi/boss/boss050/16"]
Battle_MarkDamaged = { addr = 0x800A9820, alias = true, source = "Marks the selected battlers as damaged." }
Boss_InstallBattleHooks = { addr = 0x800C1908, type = "func", source = "Installs the boss battle hooks of boss050: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C1940, type = "func", source = "Handles the boss battle events of boss050: ignores every event mode and returns 0." }
Boss_ChooseBattleEnding = { addr = 0x800C1948, type = "func", source = "Chooses how the boss battle of boss050 ends (g_BattleChooseEndingHook). On victory sets g_ScenarioState.step_05 to 0x10, runs Battle_EndVictory, sets g_SndBGMId to 0x8C; otherwise runs Battle_EndDefeat." }
Boss_EndBattle = { addr = 0x800C19A0, type = "func", source = "Ends the boss battle of boss050 (g_BattleEndHook): does nothing." }
Effect_PlayOnce = { addr = 0x800C1AEC, type = "func", source = "Plays the effect the target selector chose, raises BATTLE_STATE_EFFECT_PLAYING and clears the effect in the boss050 battle." }
Battle_EndVictory = { addr = 0x801DDED8, type = "func", source = "Ends the battle in victory: sets the battle phase to the result mode at step 1, which plays the victory sequence, poses the party and opens the result panel. Boss battles call it from their ending hook when the result is a victory.", alias = true }
Battle_EndDefeat = { addr = 0x801DDF00, type = "func", source = "Ends the battle in defeat: sets the battle phase to the result mode at step 2, which plays the defeat sequence and shows the defeat message. Boss battles call it from their ending hook when the result is not a victory.", alias = true }
