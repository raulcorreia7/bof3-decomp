Battle_ApplyDamageFlags = { addr = 0x800A9610, alias = true, source = "Applies the damage flags to the selected battlers." }
Battle_MarkDamaged = { addr = 0x800A9820, alias = true, source = "Marks the selected battlers as damaged." }
Battle_ProjectRange = { addr = 0x800AF764, type = "func", source = "Projects the battle range to the screen." }
Battle_AllocEffect = { addr = 0x801E590C, alias = true, source = "Claims a free battle effect slot." }
Effect_Reset = { addr = 0x801E5988, type = "func", source = "Clears every timer, state and flag byte of the shared BattleEffect work record; every effect countdown calls it first. battle/03 owns the body." }
g_BattleEffectBattler = { addr = 0x801EB4E0, source = "the battler the running effect acts on; Battle_UpdateEffects stores it for each effect step (emi/battle/battle/03 owns the cell)" }
g_BattleEffects = { addr = 0x801EC330, alias = true, source = "Battle effect work records (stride 0x78); Battle_AllocEffect claims a free one by setting bit 0 of header.flags." }
BMagic_GloomUpdate = { addr = 0x801EEC04, type = "func", source = "The module entry: runs the init (mode 0) or Effect_MarkDamagedOnZeroTick (mode 1)." }
BMagic_GloomInit = { addr = 0x801EEC5C, type = "func", source = "Takes the selected actor's position, starts the flare effect with a delay of 8 and counts it as live, sets STP on every colour of the battle overlay palette row, applies damage flag 0x10 to the target selector and plays the sound." }
Effect_MarkDamagedOnZeroTick = { addr = 0x801EED84, type = "func", source = "When the live-effect count (byte 0x0B) is zero marks the battlers of the target selector damaged, raises BATTLE_STATE_EFFECT_PLAYING and resets the effect in magic159 (Gloom)." }
BMagic_DispatchEffectMode = { addr = 0x801EEDE4, type = "func", source = "Runs the handler that header.mode (byte 0x01) selects from the effect handlers of magic159." }
BMagic_GloomFlareUpdate = { addr = 0x801EEE28, type = "func", source = "Runs the flare's step and, once started, projects the range, moves the screen point 8 right and 16 up and draws the flare." }
BMagic_GloomFlareWait = { addr = 0x801EEEC8, type = "func", source = "Step 0 of the flare: counts down to zero, then places the flare at the effect battler." }
BMagic_GloomFlareGrow = { addr = 0x801EEF58, type = "func", source = "Raises the counter (byte 0x09) by 1 and the timer (byte 0x0A) by 2; once the timer reaches 16 steps." }
BMagic_GloomFlareHold = { addr = 0x801EEFC4, type = "func", source = "Raises the counter by 1; once it is above 32 steps." }
BMagic_GloomFlareEnd = { addr = 0x801EF014, type = "func", source = "Step 3 of the flare: counts up, lowers the timer by 2 to zero, then lowers the effect count of the active battler and resets the effect." }
BMagic_GloomDrawFlare = { addr = 0x801EF08C, type = "func", source = "Draws a textured additive square turned on its corner round the effect point, its half-diagonal twice the counter, the top corners shaded by the timer times 8 and the bottom ones by the timer." }
g_BMagicEffectModes = { addr = 0x801EF420, source = "Handlers of magic159 (Gloom), run by header.mode (byte 0x01)." }
g_BMagicGloomFlareSteps = { addr = 0x801EF424, source = "The four steps of the flare: wait, grow, hold, end." }
