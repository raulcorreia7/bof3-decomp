["emi/plchar/plp578/00"]
PlChar_StartTurnMomo = { addr = 0x801CE448, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step. It is the step-table copy of Momo, route 0 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_RunStepScriptMomo = { addr = 0x801CE514, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script. It is the step-table copy of Momo, route 0 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_ClaimLinkSlot = { addr = 0x801CE820, type = "func", source = "When script_pc reaches CHAR_LAUNCH_SCRIPT_PC (10): claims a free actor slot as an ACTOR_TYPE_FACING_PROBE into param.actor_slot, plays the SE of byte 0x2C, clears option_flags and advances header.step." }
PlChar_PollScriptRequest = { addr = 0x801CE92C, type = "func", source = "With option_flags set, requests the script of direction once Script_AnimStepOnce reports ready and clears the flags; otherwise, when ready and the actor slot in param.actor_slot is free, clears the marker at byte 0x2B and the panel mode byte." }
PlChar_StartFacingTurn = { addr = 0x801CEA44, type = "func", source = "Starts the turn to the nearer of facings 3 and 5: stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step; in scenario 15 only clears the panel mode byte." }
PlChar_RunStepScript = { addr = 0x801CEB38, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script." }
PlChar_WalkStep = { addr = 0x801CEC78, type = "func", source = "Runs one route step of a field character: turns an even direction to a free neighbouring facing, reads the height ahead, then requests walk script 0x46 + (direction - 1) / 2 and advances header.step when the ground-ahead test passes with a height difference of at least 65, else sets the marker at byte 0x2B and plays the blocked SE." }
PlChar_AdvanceScript = { addr = 0x801CF160, type = "func", source = "Advances the character script by its phase in byte 0x0B: phase 0 and the final phase wait for Script_AnimStepOnce; on completion it clears the marker at byte 0x2B and the panel mode byte of g_Game.current." }
PlChar_ProbeCellSpawn = { addr = 0x801CF24C, type = "func", source = "Probes a map cell for the character: cell 0xF2 claims a free actor slot, spawns a field record (sometimes a second) and clears the cell; cell 0xF8 spawns a record, hands out item 0x56 with a message and clears the cell. Returns 1 when it handled the cell." }
PlChar_SpawnActor = { addr = 0x801CF444, type = "func", source = "Claims a free g_SpawnedActors entry for a character proximity actor: header.flags 1, type 0x34, header.mode from the type argument, position from the x and y arguments (16.16) and z one 0x100 above the ground height." }
PlChar_ProbeFacingCell = { addr = 0x801CF528, type = "func", source = "Returns 1 when the cell two facing steps ahead of the character holds a record (Actor_FindInRange) or has map cell code 0xF2, also testing the next cell when the x or y fraction is nonzero." }
PlChar_StartTurn = { addr = 0x801CF6A0, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step." }
PlChar_RunStepScriptNinaAdult = { addr = 0x801CF76C, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script. It is the step-table copy of adult Nina, route 2 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_StartSpawnedActorTurn = { addr = 0x801CF8AC, type = "func", source = "Turns an even direction one step back, claims a spawned actor slot of type 0x1B into param.actor_slot, requests the script of the direction, plays the character SE and advances the step." }
PlChar_ClearModeIfSlotFree = { addr = 0x801CF9C4, type = "func", source = "Clears the panel mode byte of g_Game.current when the actor slot in param.actor_slot has header.flags 0; always runs Script_AnimStepLoop." }
