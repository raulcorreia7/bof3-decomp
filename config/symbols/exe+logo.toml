Logo_Init = { addr = 0x801CE760, type = "func", source = "Sets the logo work buffers from work_base (+0x2D00, +0xA500, +0x10480), waits for CdReadSync, inits the pad, then runs Logo_InitDisplay, Logo_StartStream(disc_lba) and Logo_FadeInAudio." }
Logo_InitDisplay = { addr = 0x801CE7F4, type = "func", source = "Resets the GPU, sets NTSC video and two 320x240 display environments at y 0 and 240, clears the 960x480 frame buffer and shows the second environment with the display mask on." }
Logo_FlipDisplay = { addr = 0x801CE8DC, type = "func", source = "PutDispEnv of the other logo buffer" }
Logo_StartStream = { addr = 0x801CE930, type = "func", source = "Sets the 15-sector stream ring at D_801EB448, starts the CD stream of the movie at disc_lba (filter file 1, channel 1) retrying until each CD command is accepted, then decodes the first frame header into D_801EB468 and the first buffer." }
Logo_DrawFrame = { addr = 0x801CEA98, type = "func", source = "StGetNext to VLC to MDEC slice, returns when the picture is complete" }
Logo_StopStream = { addr = 0x801CEBFC, type = "func", source = "StUnSetRing, stop the CD, clear the MDEC callback" }
Logo_WaitFrame = { addr = 0x801CEC88, type = "func", source = "Spins while D_801EB46C, the pending slice transfer flag, is nonzero." }
Logo_DecodeSlice = { addr = 0x801CECA4, type = "func", source = "DMA-out callback: loads the decoded slice to the frame at D_801EB45C, adds 0x18 to its x and starts the next DecDCTout while x is below 0x1E0, otherwise clears D_801EB46C." }
Logo_FadeInAudio = { addr = 0x801CED48, type = "func", source = "Raises the left and right movie audio volume in s_LogoCDVolume from 0 to 0x80 in steps of 2 through CdMix." }
Logo_FadeOutAudio = { addr = 0x801CEDA4, type = "func", source = "Lowers the left and right movie audio volume in s_LogoCDVolume from 0x80 to 0 in steps of 2 through CdMix." }
Logo_Main = { addr = 0x801CEDFC, type = "func", source = "Logo player main: runs Logo_Init, then Logo_DrawFrame each frame until the stream ends or PADstart is pressed, then stops the stream, StopCallback, PadStop and SetDispMask(0)." }
