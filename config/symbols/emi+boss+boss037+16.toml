["emi/boss/boss037/16"]
Boss_InitEnemy = { addr = 0x800C1848, type = "func", source = "Sets up the current boss enemy of boss037: points its script at D_800C1990, its mode handler (member 0xE4) at func_800C18AC and its action table (member 0xE8) at D_800C199C, flags BATTLER_ACTION_OWN_MODE, sets header.mode (byte 0x01) to 2 and runs Actor_StepAnimLoop." }
Boss_InstallBattleHooks = { addr = 0x800C18FC, type = "func", source = "Installs the boss battle hooks of boss037: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C1934, type = "func", source = "Handles the boss battle events of boss037: ignores every event mode and returns 0." }
Boss_ChooseBattleEnding = { addr = 0x800C193C, type = "func", source = "Chooses how the boss battle of boss037 ends (g_BattleChooseEndingHook). On victory sets g_ScenarioState.step_05 to 28, runs Battle_EndVictory; otherwise runs Battle_EndDefeat." }
Boss_EndBattle = { addr = 0x800C1988, type = "func", source = "Ends the boss battle of boss037: the battle-end hook (g_BattleEndHook) of this set, which does nothing." }
Battle_EndVictory = { addr = 0x801DDED8, type = "func", source = "Ends the battle in victory: sets the battle phase to the result mode at step 1, which plays the victory sequence, poses the party and opens the result panel. Boss battles call it from their ending hook when the result is a victory.", alias = true }
Battle_EndDefeat = { addr = 0x801DDF00, type = "func", source = "Ends the battle in defeat: sets the battle phase to the result mode at step 2, which plays the defeat sequence and shows the defeat message. Boss battles call it from their ending hook when the result is not a victory.", alias = true }
