["emi/plchar/plp015/00"]
PlChar_AdvanceScript = { addr = 0x801CEC30, type = "func", source = "Advances the character script by its phase in byte 0x0B: phase 0 and the final phase wait for Script_AnimStepOnce; on completion it clears the marker at byte 0x2B and the panel mode byte of g_Game.current." }
PlChar_ProbeCellSpawn = { addr = 0x801CED1C, type = "func", source = "Probes a map cell for the character: cell 0xF2 claims a free actor slot, spawns a field record (sometimes a second) and clears the cell; cell 0xF8 spawns a record, hands out item 0x56 with a message and clears the cell. Returns 1 when it handled the cell." }
PlChar_SpawnActor = { addr = 0x801CEF14, type = "func", source = "Claims a free g_SpawnedActors entry for a character proximity actor: header.flags 1, type 0x34, header.mode from the type argument, position from the x and y arguments (16.16) and z one 0x100 above the ground height." }
PlChar_ProbeFacingCell = { addr = 0x801CEFF8, type = "func", source = "Returns 1 when the cell two facing steps ahead of the character holds a record (Actor_FindInRange) or has map cell code 0xF2, also testing the next cell when the x or y fraction is nonzero." }
PlChar_StartTurn = { addr = 0x801CF170, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step." }
PlChar_RunStepScript = { addr = 0x801CF23C, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script." }
PlChar_StartSpawnedActorTurn = { addr = 0x801CF37C, type = "func", source = "same body as emi/plchar/plp578/00@0x801CF8AC PlChar_StartSpawnedActorTurn" }
PlChar_ClearModeIfSlotFree = { addr = 0x801CF494, type = "func", source = "Clears the panel mode byte of g_Game.current when the actor slot in param.actor_slot has header.flags 0; always runs Script_AnimStepLoop." }
PlChar_StartTurnMomo = { addr = 0x801CF544, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step. It is the step-table copy of Momo, route 2 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_AdvanceFacingTurn = { addr = 0x801CF610, type = "func", source = "Turns the character to the target facing in byte 0x03: on a match requests script 0x41 (facing down) or 0x40 (facing right) and advances header.step; otherwise counts timer down and at 0 reloads it with 2, steps direction by turn_step and requests that direction script." }
PlChar_ClaimLinkSlot = { addr = 0x801CF91C, type = "func", source = "When script_pc reaches CHAR_LAUNCH_SCRIPT_PC (10): claims a free actor slot as an ACTOR_TYPE_FACING_PROBE into param.actor_slot, plays the SE of byte 0x2C, clears option_flags and advances header.step." }
PlChar_PollScriptRequest = { addr = 0x801CFA28, type = "func", source = "With option_flags set, requests the script of direction once Script_AnimStepOnce reports ready and clears the flags; otherwise, when ready and the actor slot in param.actor_slot is free, clears the marker at byte 0x2B and the panel mode byte." }
