["emi/plchar/plp016/00"]
PlChar_AdvanceScript = { addr = 0x801CEC30, type = "func", source = "Advances the character script by its phase in byte 0x0B: phase 0 and the final phase wait for Script_AnimStepOnce; on completion it clears the marker at byte 0x2B and the panel mode byte of g_Game.current." }
PlChar_ProbeCellSpawn = { addr = 0x801CED1C, type = "func", source = "Probes a map cell for the character: cell 0xF2 claims a free actor slot, spawns a field record (sometimes a second) and clears the cell; cell 0xF8 spawns a record, hands out item 0x56 with a message and clears the cell. Returns 1 when it handled the cell." }
PlChar_SpawnActor = { addr = 0x801CEF14, type = "func", source = "Claims a free g_SpawnedActors entry for a character proximity actor: header.flags 1, type 0x34, header.mode from the type argument, position from the x and y arguments (16.16) and z one 0x100 above the ground height." }
PlChar_ProbeFacingCell = { addr = 0x801CEFF8, type = "func", source = "Returns 1 when the cell two facing steps ahead of the character holds a record (Actor_FindInRange) or has map cell code 0xF2, also testing the next cell when the x or y fraction is nonzero." }
PlChar_StartTurn = { addr = 0x801CF170, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step." }
PlChar_RunStepScript = { addr = 0x801CF23C, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script." }
PlChar_StartSpawnedActorTurn = { addr = 0x801CF37C, type = "func", source = "same body as emi/plchar/plp578/00@0x801CF8AC PlChar_StartSpawnedActorTurn" }
PlChar_ClearModeIfSlotFree = { addr = 0x801CF494, type = "func", source = "Clears the panel mode byte of g_Game.current when the actor slot in param.actor_slot has header.flags 0; always runs Script_AnimStepLoop." }
PlChar_StartTurnPeco = { addr = 0x801CF544, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step. It is the step-table copy of Peco, route 2 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_RunStepScriptPeco = { addr = 0x801CF610, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script. It is the step-table copy of Peco, route 2 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_FaceFreeDirection = { addr = 0x801CF7B4, type = "func", source = "Steps direction to a free neighbouring facing when it is even, then requests script 0x42 + (direction - 1) / 2 and sets param byte 0x0B to 0, byte 0x0A to 0x0B and byte 0x03 to 1." }
PlChar_RunPersonalAction = { addr = 0x801CF8B4, type = "func", source = "Runs the personal action's target step after the turn wait: marks the actor slot of the rock the character faces (byte 0x0A set to 1, byte 0x08 to the facing) for the action, else probes the cell ahead for a field actor and a map-cell spawn; stores the slot in work byte 0x06 and adds 2 to work byte 0x03 when a rock is found, 1 otherwise." }
PlChar_AdvancePaletteScript = { addr = 0x801CFB00, type = "func", source = "Advances the character script by its phase in byte 0x0B: phase 1 stages the palette of byte 0x05, phase 2 selects the script of direction once Script_AnimStepOnce reports ready; ends and clears the panel mode when g_GameStateIndex is GAME_REQUEST_IDLE." }
PlChar_StartFacingScript = { addr = 0x801CFC30, type = "func", source = "Selects the script of direction once Script_AnimStepOnce reports ready and adds 1 to byte 0x03." }
PlChar_ClearSlotRefIfUnused = { addr = 0x801CFC90, type = "func", source = "When the actor slot in byte 0x06 is free or has header.mode (byte 0x01) 1 and g_AreaCameraMoving is 0, clears byte 0x06 and lowers byte 0x03 by 2." }
PlChar_SpawnLinkedActor = { addr = 0x801CFF30, type = "func", source = "Claims a free g_SpawnedActors entry for a linked character proximity actor: header.flags 1, type 0x34, header.mode from the type argument, position from the x and y arguments (16.16), z one 0x200 above the ground height and link 1." }
PlChar_ReleaseSpawnedActor = { addr = 0x801D00CC, type = "func", source = "Once Script_AnimStepOnce reports ready: requests the script of direction and sets the target facing in byte 0x03 to FACING_UP_RIGHT. Otherwise counts unk_0A down and at zero plays the SE of byte 0x2C, copies direction and option_flags (ACTOR_OPT_HIDDEN_ON_SPAWN when none) into the g_SpawnedActors record of param.actor_slot, and plays common SE 11." }
PlChar_ClearModeIfUnused = { addr = 0x801D0204, type = "func", source = "When the actor slot in param.actor_slot is free or has header.mode (byte 0x01) 1 and g_AreaCameraMoving is 0, clears the marker at byte 0x2B and the panel mode byte; always runs Script_AnimStepLoop." }
PlChar_ProbeFacingClearance = { addr = 0x801D0444, type = "func", source = "Probes facing clearance for the free-direction choice: sets byte 0x2B to 0 when the cell to the right or below is a high step above the character." }
