BMagic_AllocEffect = { addr = 0x801EFB78, type = "func", source = "Claims the first free slot of the effect table (bit 0 of header.flags) and returns its index, or 0xFF when all 64 slots are in use in magic223 (Tempest, Hurricane)." }
