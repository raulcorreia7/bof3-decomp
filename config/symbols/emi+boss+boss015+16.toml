["emi/boss/boss015/16"]
Boss_InstallBattleHooks = { addr = 0x800C18F0, type = "func", source = "Installs the boss battle hooks of boss015: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C1928, type = "func", source = "Handles the boss battle events of boss015: ignores every event mode and returns 0." }
Boss_ChooseBattleEnding = { addr = 0x800C1930, type = "func", source = "Chooses how the boss battle of boss015 ends (g_BattleChooseEndingHook). On victory sets script variable 0 to 0x4B, runs Battle_EndVictory; otherwise runs Battle_EndDefeat." }
Boss_EndBattle = { addr = 0x800C197C, type = "func", source = "Ends the boss battle of boss015: the battle-end hook (g_BattleEndHook) of this set, which runs func_800AC934(1)." }
Battle_EndVictory = { addr = 0x801DDED8, type = "func", source = "Ends the battle in victory: sets the battle phase to the result mode at step 1, which plays the victory sequence, poses the party and opens the result panel. Boss battles call it from their ending hook when the result is a victory.", alias = true }
Battle_EndDefeat = { addr = 0x801DDF00, type = "func", source = "Ends the battle in defeat: sets the battle phase to the result mode at step 2, which plays the defeat sequence and shows the defeat message. Boss battles call it from their ending hook when the result is not a victory.", alias = true }
