Menu_ApplyEquipment = { addr = 0x801D1E8C, type = "func", source = "Applies the equipment menu's trial set to g_Characters[7]: for each slot whose chosen item changed it removes the new item from the inventory, returns the old one and stores the new one, then rebuilds the record's stats." }
