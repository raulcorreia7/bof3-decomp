Menu_DrawEquipCompareWindow = { addr = 0x801D5634, type = "func", source = "Draws the equipment compare window: the party member's power, defense, intelligence and agility, the values the equipment in patch would give with an icon chosen by each compare flag, and the six equipment slots with the task's two selected slots raised." }
