Menu_DrawTintedLine = { addr = 0x801D36B8, type = "func", source = "Draws one semi-transparent LINE_F2 from (line_x0, line_y0) to (line_x1, line_y1) in the colour given by color_r, color_g and color_b, with the draw mode tpage in the font page." }
Menu_DrawItemRow = { addr = 0x801D37AC, type = "func", source = "Draws the party row of character item: HP and AP values with their labels, the experience icon with the experience, and the next-level experience, or dashes from level 99; the palette is 7 when selection is nonzero." }
Menu_DrawEquipment = { addr = 0x801D3B4C, type = "func", source = "Draws the equipment list of g_Characters[index]: the weapon, shield, helmet, armor and two accessory names with their row icons; the palette is 7 when selection is nonzero." }
Menu_DrawFormationPreview = { addr = 0x801D3E18, type = "func", source = "Draws the formation preview of the party formation menu: the formation's name, its ground arrow and its members' icons, turned by angle, sorted back to front, members whose blink bit is set pulsing." }
Menu_DrawIcon = { addr = 0x801D4564, type = "func", source = "Draws a 16x8 menu icon from column icon_column of row 216 of the icon atlas at sprite_x, sprite_y, dark (0x10) when shade_mode is nonzero." }
Menu_DrawPanelIcon = { addr = 0x801D4678, type = "func", source = "Draws one menu icon cell at x, y from atlas position u, v with clut and the grey level color, through MenuDrawPanelIcon." }
Menu_DrawExperienceLine = { addr = 0x801D4730, type = "func", source = "Draws the red experience line of a character from x, y: its length is the experience gained since level, scaled by 57 over the span to the next level, and is zero when both levels need the same experience." }
Menu_DrawZennyWindow = { addr = 0x801D484C, type = "func", source = "Draws the zenny window at panel_x, panel_y: the caption_value printed through g_MenuZennyFormat, the zenny icon and the caption glyph runs." }
Menu_DrawPlayTimeWindow = { addr = 0x801D49D4, type = "func", source = "Draws the play time window at panel_x, panel_y: hours and minutes of g_PlayClock and a colon that shows while g_PlayClock.thirtieths is below 15, then the clock caption and glyph runs." }
Menu_ChooseYesNo = { addr = 0x801D4BD0, type = "func", source = "Runs the yes/no prompt of the menu: the cursor sits at a position set by flag D_8014865B, left or right flips the flag, Cancel clears it and returns true, Confirm keeps it and returns true." }
Menu_DrawCommandRow = { addr = 0x801D4CD4, type = "func", source = "Draws the command buttons of g_MenuCommandRows[row] (up to four, count in byte 0): label and frame per button, the selected one with the selected frame. A button is dimmed (colour 7) when it is not the selected one, when label 0x12 shows without g_GameRequestFlags bit 0, or when label 8 shows without the fountain pen and without ink." }
Item_GetPrice = { addr = 0x801D4F1C, type = "func", source = "Returns the u16 price of item_id from the table of its category: item, weapon, armor or accessory." }
Char_GetExpForLevel = { addr = 0x801D4FD0, type = "func", source = "Returns the experience a character needs to reach a level: the sum of the first level u16 entries of the character row of g_LevelGrowth, or -1 from level 100." }
Char_GetExpProgress = { addr = 0x801D504C, type = "func", source = "Returns how far exp is between the experience of level and of level + 1, scaled to 0x18 steps (0 when both levels need the same experience)." }
