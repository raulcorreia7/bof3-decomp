BMagic_WallOfFireTargetEnd = { addr = 0x801EF154, type = "func", source = "Counts the timer down; once every effect it spawned has ended and the 0x80 mark is set on the task's live-effect count (byte 0x0B), frees the battler's palette fade, fades it if poisoned, lowers the active battler's live-effect count and resets the effect." }
