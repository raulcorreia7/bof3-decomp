BMagic_WallOfFireFlameGrow = { addr = 0x801EF654, type = "func", source = "Raises the flame's timer by 4 per frame; at 17 steps." }
Effect_CountUpAndMarkBattler = { addr = 0x801EF6A4, type = "func", source = "Counts the effect timer (byte 0x09) and counter (byte 0x0A) up; at 0x19 sets bit 0x80 of the active battler's ticker (byte 0x0B) and advances header.step (byte 0x02) in magic144 (Wall of Fire)." }
Effect_CountDownByTwoFinishAtOne = { addr = 0x801EF738, type = "func", source = "Counts the effect timer (byte 0x09) down by two and the counter (byte 0x0A) up on odd frames; when the timer reaches 1 lowers the active battler's ticker (byte 0x0B) and clears the effect in magic144 (Wall of Fire)." }
Effect_DrawFlameColumn = { addr = 0x801EF818, type = "func", source = "Draws the flame column of magic144 (Wall of Fire): 28 rows of four textured quads whose half widths follow a sine of the row, the outer pair fading to black, on page (832, 256) with clut 506." }
BMagic_WallOfFireGlowUpdate = { addr = 0x801EFF74, type = "func", source = "Runs the glow's step; once started moves its screen point 16 to the side its param picks and 12 up each frame and draws the glow." }
Effect_AppearAtTarget = { addr = 0x801F0034, type = "func", source = "Copies the position of battler g_BattleEffectBattler into the effect, unhides it, clears the effect timer (byte 0x09) and advances header.step (byte 0x02) in magic144 (Wall of Fire)." }
BMagic_WallOfFireGlowGrow = { addr = 0x801F00A0, type = "func", source = "Raises the glow's timer by 2 per frame; at 16 steps." }
Effect_StepOnTickFlag = { addr = 0x801F00F0, type = "func", source = "Advances header.step (byte 0x02) while bit 0x80 of the ticker (byte 0x0B) of battler g_BattleEffectBattler is set in magic144 (Wall of Fire)." }
Effect_TickCounter = { addr = 0x801F0134, type = "func", source = "Counts the effect timer (byte 0x09) down; at zero lowers the active battler's ticker (byte 0x0B) and clears the effect in magic144 (Wall of Fire)." }
BMagic_WallOfFireDrawGlow = { addr = 0x801F01D0, type = "func", source = "Draws the glow as a fan of eight additive triangles around the effect's screen point, radius 64 to 79 picked once per draw, red at the centre with a fifth of it in green and blue." }
BMagic_AllocEffect = { addr = 0x801F046C, type = "func", source = "Claims the first free slot of the 48-entry effect table (bit 0 of header.flags) and returns its index, or 0xFF when every slot is in use in magic144 (Wall of Fire)." }
