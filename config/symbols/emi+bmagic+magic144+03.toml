BMagic_WallOfFireSlotUpdate = { addr = 0x801EF510, type = "func", source = "Runs the handler header.mode selects for an effect of the record table." }
BMagic_WallOfFireFlameUpdate = { addr = 0x801EF554, type = "func", source = "Runs the flame's step and draws the flame column once it has started." }
