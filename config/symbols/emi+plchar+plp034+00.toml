["emi/plchar/plp034/00"]
PlChar_AdvanceScript = { addr = 0x801CEC30, type = "func", source = "Advances the character script by its phase in byte 0x0B: phase 0 and the final phase wait for Actor_StepAnimOnce; on completion it clears the marker at byte 0x2B and the panel mode byte of g_Game.current." }
PlChar_ProbeCellSpawn = { addr = 0x801CED1C, type = "func", source = "Probes a map cell for the character: cell 0xF2 claims a free actor slot, spawns a field record (sometimes a second) and clears the cell; cell 0xF8 spawns a record, hands out item 0x56 with a message and clears the cell. Returns 1 when it handled the cell." }
PlChar_SpawnActor = { addr = 0x801CEF14, type = "func", source = "Claims a free g_SpawnedActors entry for a character proximity actor: header.flags 1, type 0x34, header.mode from the kind argument, position from the x and y arguments (16.16) and z one 0x100 above the ground height." }
PlChar_ProbeFacingCell = { addr = 0x801CEFF8, type = "func", source = "Returns 1 when the cell two facing steps ahead of the character holds a record (Actor_FindInRange) or has map cell code 0xF2, also testing the next cell when the x or y fraction is nonzero." }
PlChar_StartTurn = { addr = 0x801CF170, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step." }
PlChar_RunStepScriptTeepo = { addr = 0x801CF23C, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script. It is the step-table copy of Teepo, route 1 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_RunPersonalAction = { addr = 0x801CF4E0, type = "func", source = "Runs the personal action's target step after the turn wait: marks the actor slot of the rock the character faces (byte 0x0A set to 1, byte 0x08 to the facing) for the action, else probes the cell ahead for a field actor and a map-cell spawn; stores the slot in work byte 0x06 and adds 2 to work byte 0x03 when a rock is found, 1 otherwise." }
PlChar_AdvancePaletteScript = { addr = 0x801CF71C, type = "func", source = "Advances the character script by its phase in byte 0x0B: phase 1 stages the palette of byte 0x05, phase 2 selects the script of direction once Actor_StepAnimOnce reports ready; ends and clears the panel mode when g_GameStateIndex is GAME_REQUEST_IDLE." }
PlChar_StartFacingScript = { addr = 0x801CF84C, type = "func", source = "Selects the script of direction once Actor_StepAnimOnce reports ready and adds 1 to byte 0x03." }
PlChar_ClearSlotRefIfUnused = { addr = 0x801CF8AC, type = "func", source = "When the actor slot in byte 0x06 is free or has header.mode (byte 0x01) 1 and g_AreaCameraMoving is 0, clears byte 0x06 and lowers byte 0x03 by 2." }
PlChar_SpawnLinkedActor = { addr = 0x801CFB4C, type = "func", source = "Claims a free g_SpawnedActors entry for a linked character proximity actor: header.flags 1, type 0x34, header.mode from the kind argument, position from the x and y arguments (16.16), z one 0x200 above the ground height and link 1." }
PlChar_UpdateLinkedFacing = { addr = 0x801CFCF4, type = "func", source = "Requests the script of direction and sets byte 0x03 to 2 once Actor_StepAnimOnce reports ready; otherwise counts byte 0x0A down and at 0 copies direction and option_flags into the linked actor slot and plays SE 0x10B." }
PlChar_ClearPanelModeIfUnused = { addr = 0x801CFE14, type = "func", source = "Clears the panel mode byte when the actor slot is unused and the camera is not moving, then runs Actor_StepAnimLoop." }
PlChar_StartTurnRei = { addr = 0x801D0094, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step. It is the step-table copy of Rei, route 2 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_RunStepScript = { addr = 0x801D0160, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script." }
