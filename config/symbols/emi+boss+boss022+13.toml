["emi/boss/boss022/13"]
Battle_ShowActorEntry = { addr = 0x800AC844, type = "func", source = "Clears the hidden flag of the actor entry entry_id, which draws the battler again.", alias = true }
Boss_EndEntrance = { addr = 0x800C18B8, type = "func", source = "Ends the entrance of boss022: once Script_AnimStepOnce reports the actor script ready, sets header.mode (byte 0x01) to 2." }
Boss_EndDefeat = { addr = 0x800C1938, type = "func", source = "Defeats the boss with Battle_DefeatEnemy (banks its EXP and Zenny, counts it off and sets BATTLE_RESULT_VICTORY for the last enemy), flags the enemy to skip its action step, unhides the actor and sets header.mode (byte 0x01) to 3 with the step cleared in boss022." }
Boss_InstallBattleHooks = { addr = 0x800C1A08, type = "func", source = "Installs the boss battle hooks of boss022: Boss_ChooseBattleEnding into g_BattleChooseEndingHook, Boss_EndBattle into g_BattleEndHook and Boss_RunBattleEvent into g_BossBattleEventHook." }
Boss_RunBattleEvent = { addr = 0x800C1A40, type = "func", source = "Handles the boss battle events of boss022: ignores every event mode and returns 0." }
Boss_ChooseBattleEnding = { addr = 0x800C1A48, type = "func", source = "Chooses how the boss battle of boss022 ends: the ending hook (g_BattleChooseEndingHook) of this set." }
Boss_EndBattle = { addr = 0x800C1ABC, type = "func", source = "Ends the boss battle of boss022 (g_BattleEndHook): runs Battle_ShowActorEntry(0), takes the actor func_800AC754(0) returns, finds scene record 0xAA, clears work bytes 0x2A and 0x48 and selects script 6." }
Battle_EndToArea = { addr = 0x801DDF28, type = "func", source = "Ends the battle without a result panel: sets the battle phase to the result mode at step 3, which reloads the party sprites and the area audio and hands the scene back to its script.", alias = true }
