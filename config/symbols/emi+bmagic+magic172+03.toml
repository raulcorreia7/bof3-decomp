["emi/bmagic/magic172/03"]
Battle_ApplyDamageFlags = { addr = 0x800A9610, alias = true, source = "Applies the damage flags to the selected battlers." }
Battle_MarkDamaged = { addr = 0x800A9820, alias = true, source = "Marks the selected battlers as damaged." }
Battle_StepRangeToward = { addr = 0x800AF3A0, type = "func", source = "Moves the battle range one step toward a point: the range's x and y axes and its vertical span each move by the step along the unit direction to the point. battle/15 owns the body." }
Battle_ProjectRange = { addr = 0x800AF764, type = "func", source = "Projects the battle range to the screen." }
Battle_AllocEffect = { addr = 0x801E590C, alias = true }
Effect_Reset = { addr = 0x801E5988, type = "func", source = "Clears every timer, state and flag byte of the shared BattleEffect work record; every effect countdown calls it first. battle/03 owns the body.", alias = true }
g_BattleEffectBattler = { addr = 0x801EB4E0, source = "the battler the running effect acts on; Battle_UpdateEffects stores it for each effect step (emi/battle/battle/03 owns the cell)" }
g_BattleEffects = { addr = 0x801EC330, alias = true }
BMagic_MagicBallUpdate = { addr = 0x801EEC04, type = "func", source = "The module entry: runs the init (mode 0) or Effect_MarkDamagedOnZeroTick (mode 1)." }
BMagic_MagicBallInit = { addr = 0x801EEC5C, type = "func", source = "Takes the effect battler's facing and position, starts the core effect and eight trail effects (a trail's index is its delay of 1 to 8 frames and its tint row), counts all nine as live and plays the sound." }
Effect_MarkDamagedOnZeroTick = { addr = 0x801EEDD8, type = "func", source = "When the live-effect count (byte 0x0B) is zero marks the battlers of the target selector damaged, raises BATTLE_STATE_EFFECT_PLAYING and resets the effect in magic172 (Magic Ball)." }
BMagic_DispatchEffectMode = { addr = 0x801EEE38, type = "func", source = "Runs the handler that header.mode (byte 0x01) selects from the effect handlers of magic172." }
BMagic_MagicBallCoreUpdate = { addr = 0x801EEE7C, type = "func", source = "Runs the core's step and draws it by step: bolts, disc and ring in steps 0 and 1; more and wider bolts, disc, ring and both wave rings in step 2; the wave rings in step 3; bolts only in step 4." }
BMagic_MagicBallCorePlace = { addr = 0x801EF158, type = "func", source = "Core step 0: places the core above the effect battler, aims it at the selected actor and clears the counters." }
BMagic_MagicBallCoreFly = { addr = 0x801EF210, type = "func", source = "Core step 1: steps the core toward the selected actor and, when it arrives, applies the hit and sounds the impact." }
BMagic_MagicBallCoreBurst = { addr = 0x801EF3A4, type = "func", source = "Raises the wave radius (byte 0x0B) by 2 per frame and the timer (byte 0x0A) by 2 up to 16, counts the counter (byte 0x09) down from 16 and steps at zero." }
BMagic_MagicBallCoreFade = { addr = 0x801EF430, type = "func", source = "Raises the wave radius by 4 and lowers the timer by 2 per frame; at zero plays the end sound, loads the counter with 16 and steps." }
Effect_TickOnTimerZero = { addr = 0x801EF4BC, type = "func", source = "Counts the counter (byte 0x09) down by 2 per frame; at zero lowers the live-effect count (byte 0x0B) of battler g_BattleEffectBattler and clears the effect in magic172 (Magic Ball)." }
BMagic_MagicBallTrailUpdate = { addr = 0x801EF518, type = "func", source = "Runs the trail's step and, once past its first step, draws it." }
BMagic_MagicBallTrailPlace = { addr = 0x801EF590, type = "func", source = "Counts the counter (the delay of 1 to 8 frames) down; at zero places the trail at the effect battler 0x800000 up, aims it at the selected actor, clears the counter and steps." }
BMagic_MagicBallTrailFly = { addr = 0x801EF650, type = "func", source = "Raises the counter by 4 up to 16, moves the trail one step of 0x40 toward the selected actor, tracks its heading and steps once the core has reached its step 2." }
Effect_TickOnTimerNegative = { addr = 0x801EF770, type = "func", source = "Counts the counter (byte 0x09) down by two; once negative lowers the live-effect count (byte 0x0B) of battler g_BattleEffectBattler and clears the effect in magic172 (Magic Ball)." }
BMagic_MagicBallDrawDisc = { addr = 0x801EF7CC, type = "func", source = "Draws a disc of sixteen additive triangles of radius 16 round the effect point: grey in the centre by 12 times the counter, a bluer shade at the rim by 2 and 14 times it." }
BMagic_MagicBallDrawRing = { addr = 0x801EFA2C, type = "func", source = "Draws a ring of sixteen additive quads from radius 16 to 24 round the effect point: blue on the inside by the counter (blue 14 times it), black outside." }
BMagic_MagicBallDrawWaveInner = { addr = 0x801EFD04, type = "func", source = "Draws a ring of sixteen additive quads from the wave radius (byte 0x0B) to twice it, black inside and blue-green outside by the timer (6 and 8 times it)." }
BMagic_MagicBallDrawWaveOuter = { addr = 0x801EFFE8, type = "func", source = "Draws a ring of sixteen additive quads from twice the wave radius to four times it, blue-green inside by the timer (5 and 8 times it) and black outside." }
BMagic_MagicBallDrawBoltWide = { addr = 0x801F02C8, type = "func", source = "Draws one jagged additive line out from the effect point at angle: each segment turns by up to 0x7F and grows by a random share of spread, the shade falls with the length past 12 before step 3, and the line ends once it is shorter than 16 again." }
BMagic_MagicBallDrawBoltNarrow = { addr = 0x801F05E8, type = "func", source = "Draws one jagged additive line out from the effect point at angle: each segment turns by up to 0x3F and grows by a random share of spread, the shade falls with the length past 8 before step 3, and the line ends once it is shorter than 12 again." }
BMagic_MagicBallDrawTrail = { addr = 0x801F0908, type = "func", source = "Draws a disc of sixteen additive triangles of radius 24 round the effect point, its centre shaded by the counter and the trail's tint (its row of g_BMagicMagicBallTrailTints), black at the rim." }
g_BMagicEffectModes = { addr = 0x801F0B74, source = "Handlers of magic172 (Magic Ball), run by header.mode (byte 0x01)." }
g_BMagicMagicBallCoreSteps = { addr = 0x801F0B7C, source = "The five steps of the core: place, fly, burst, fade, end." }
g_BMagicMagicBallTrailSteps = { addr = 0x801F0B90, source = "The three steps of a trail: place, fly, end." }
g_BMagicMagicBallTrailTints = { addr = 0x801F0B9C, source = "The red and blue weights of the centre colour of each of the eight trails, by trail index, fading from the first to the last." }
