["emi/bmagic/magic091/03"]
g_BattleEffectPalette = { addr = 0x8003AC00, source = "the palette row the magic091 effect fills from g_BattlePalettes: entries 1 to 15 with the high bit set, entry 0 clear" }
Battle_ApplyDamageFlags = { addr = 0x800A9610, type = "func", source = "Applies the damage flags to the selected battlers." }
Battle_MarkDamaged = { addr = 0x800A9820, alias = true, source = "Marks the selected battlers as damaged." }
Battle_ProjectRange = { addr = 0x800AF764, alias = true, source = "Projects the battle range to the screen." }
Battle_AllocEffect = { addr = 0x801E590C, alias = true, source = "Claims a free battle effect slot." }
Effect_Reset = { addr = 0x801E5988, type = "func", source = "Clears every timer, state and flag byte of the shared BattleEffect work record; every effect countdown calls it first. battle/03 owns the body.", alias = true }
g_BattleEffectBattler = { addr = 0x801EB4E0, source = "the battler the running effect acts on; Battle_UpdateEffects stores it for each effect step (emi/battle/battle/03 owns the cell)" }
g_BattleEffects = { addr = 0x801EC330, alias = true, source = "Battle effect work records (stride 0x78); Battle_AllocEffect claims a free one by setting bit 0 of header.flags." }
g_BMagicRingModes = { addr = 0x801EEC04, source = "The routines of the task, run by header.mode: start, expand, finish." }
BMagic_RingUpdate = { addr = 0x801EEC10, type = "func", source = "The module entry: runs the task step that header.mode selects from g_BMagicRingModes, then, while the effect is flagged, draws the red disc, the actor matrix and the shade behind the battlers." }
BMagic_RingStart = { addr = 0x801EECCC, type = "func", source = "Task mode 0: copies the selected actor's facing and position into the task, starts BMAGIC_RING_COUNT ring bands BMAGIC_RING_STAGGER frames apart, copies the battle palette with its high bit set, queues the selection sound and applies the damage flags." }
BMagic_RingExpand = { addr = 0x801EEE3C, type = "func", source = "Task mode 1: raises the disc radius step (byte 0x09) and the shade level (byte 0x0A) by one per frame; at BMAGIC_RING_EXPAND_LIMIT advances header.mode." }
BMagic_RingFinish = { addr = 0x801EEEA8, type = "func", source = "Task mode 2: lowers the disc radius step (byte 0x09) while fewer than 4 rings are live and the shade level (byte 0x0A) while fewer than 3; once the shade level and the live ring count (byte 0x0B) are both zero marks the battlers of the target selector damaged, raises BATTLE_STATE_EFFECT_PLAYING and resets the effect." }
BMagic_RingBandUpdate = { addr = 0x801EEF74, type = "func", source = "Runs the ring band step that header.mode selects from g_BMagicRingBandModes and, while it is alive and past its first step, draws the band under the actor matrix." }
BMagic_RingBandWait = { addr = 0x801EEFFC, type = "func", source = "Ring band mode 0: counts the start delay (byte 0x09) down; at zero copies the position of the task, sets the radius step to BMAGIC_RING_BAND_RADIUS, clears the wave height (byte 0x0A) and the phase (byte 0x0B) and advances header.mode." }
BMagic_RingBandShrink = { addr = 0x801EF09C, type = "func", source = "Ring band mode 1: raises the phase (byte 0x0B) by 1 and the wave height (byte 0x0A) by 2 per frame while the radius step (byte 0x09) falls by 2; at BMAGIC_RING_BAND_SHRINK_LIMIT advances header.mode." }
BMagic_RingBandEnd = { addr = 0x801EF124, type = "func", source = "Ring band mode 2: raises the phase by 1 and lowers the wave height by 3 per frame while the radius step falls by 2; at zero lowers the live ring count (byte 0x0B) of the task and resets the effect." }
BMagic_RingBandDraw = { addr = 0x801EF240, type = "func", source = "Draws the ring band: 32 textured quads around the effect cell, the outer edge rising and falling with the phase and the inner edge shaded by it." }
Effect_SetActorMatrix = { addr = 0x801EF700, type = "func", source = "Sets the actor's GTE matrix from its coordinates and half its vertical span, times the camera in magic091 (Flare)." }
BMagic_RingDrawDisc = { addr = 0x801EF7B0, type = "func", source = "Draws the disc of 8 semi-transparent triangles around the task's screen point, the radius twice the radius step plus 32 and the centre red by the radius step times 10." }
BMagic_RingDrawShade = { addr = 0x801EF9E4, type = "func", source = "Draws the shade: 8 semi-transparent triangles of radius 0x120 behind the battlers, subtractive, the centre shaded by the shade level (byte 0x0A) times 12." }
g_BMagicRingBandModes = { addr = 0x801EFC64, source = "The routines of a ring band, run by header.mode: wait, shrink, end, and one that no mode reaches." }
