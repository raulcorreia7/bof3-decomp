["emi/plchar/plp567/00"]
PlChar_StartTurn = { addr = 0x801CE448, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step." }
PlChar_RunStepScriptMomo = { addr = 0x801CE514, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script. It is the step-table copy of Momo, route 0 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_ClaimLinkSlot = { addr = 0x801CE820, type = "func", source = "When script_pc reaches CHAR_LAUNCH_SCRIPT_PC (10): claims a free actor slot as an ACTOR_TYPE_FACING_PROBE into param.actor_slot, plays the SE of byte 0x2C, clears option_flags and advances header.step." }
PlChar_PollScriptRequest = { addr = 0x801CE92C, type = "func", source = "With option_flags set, requests the script of direction once Script_AnimStepOnce reports ready and clears the flags; otherwise, when ready and the actor slot in param.actor_slot is free, clears the marker at byte 0x2B and the panel mode byte." }
PlChar_StartTurnPeco = { addr = 0x801CEA44, type = "func", source = "Starts the character turn: picks the farther of this image's two turn facings from direction, stores it in byte 0x03 and its Actor_GetTurnStep sign in param.turn_step, sets timer to 2 and advances header.step. It is the step-table copy of Peco, route 1 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_RunStepScript = { addr = 0x801CEB10, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script." }
PlChar_FaceFreeDirection = { addr = 0x801CECB4, type = "func", source = "Steps direction to a free neighbouring facing when it is even, then requests script 0x42 + (direction - 1) / 2 and sets param byte 0x0B to 0, byte 0x0A to 0x0B and byte 0x03 to 1." }
PlChar_RunPersonalAction = { addr = 0x801CEDB4, type = "func", source = "Runs the personal action's target step after the turn wait: marks the actor slot of the rock the character faces (byte 0x0A set to 1, byte 0x08 to the facing) for the action, else probes the cell ahead for a field actor and a map-cell spawn; stores the slot in work byte 0x06 and adds 2 to work byte 0x03 when a rock is found, 1 otherwise." }
PlChar_AdvancePaletteScript = { addr = 0x801CF000, type = "func", source = "Advances the character script by its phase in byte 0x0B: phase 1 stages the palette of byte 0x05, phase 2 selects the script of direction once Script_AnimStepOnce reports ready; ends and clears the panel mode when g_GameStateIndex is GAME_REQUEST_IDLE." }
PlChar_StartFacingScript = { addr = 0x801CF130, type = "func", source = "Selects the script of direction once Script_AnimStepOnce reports ready and adds 1 to byte 0x03." }
PlChar_ClearSlotRefIfUnused = { addr = 0x801CF190, type = "func", source = "When the actor slot in byte 0x06 is free or has header.mode (byte 0x01) 1 and g_AreaCameraMoving is 0, clears byte 0x06 and lowers byte 0x03 by 2." }
PlChar_SpawnLinkedActor = { addr = 0x801CF430, type = "func", source = "Claims a free g_SpawnedActors entry for a linked character proximity actor: header.flags 1, type 0x34, header.mode from the type argument, position from the x and y arguments (16.16), z one 0x200 above the ground height and link 1." }
PlChar_ReleaseSpawnedActor = { addr = 0x801CF5CC, type = "func", source = "Once Script_AnimStepOnce reports ready: requests the script of direction and sets the target facing in byte 0x03 to FACING_UP_RIGHT. Otherwise counts unk_0A down and at zero plays the SE of byte 0x2C, copies direction and option_flags (ACTOR_OPT_HIDDEN_ON_SPAWN when none) into the g_SpawnedActors record of param.actor_slot, and plays common SE 11." }
PlChar_ClearModeIfUnused = { addr = 0x801CF704, type = "func", source = "When the actor slot in param.actor_slot is free or has header.mode (byte 0x01) 1 and g_AreaCameraMoving is 0, clears the marker at byte 0x2B and the panel mode byte; always runs Script_AnimStepLoop." }
PlChar_ProbeFacingClearance = { addr = 0x801CF944, type = "func", source = "Probes facing clearance for the free-direction choice: sets byte 0x2B to 0 when the cell to the right or below is a high step above the character." }
PlChar_StartNearestFacingTurn = { addr = 0x801CFAEC, type = "func", source = "Starts the turn to the nearer of facings 3 and 5: stores it in byte 0x03 and its func_801B2D00 sign in param.turn_step, sets timer to 2 and advances header.step; in scenario 15 only clears the panel mode byte." }
PlChar_RunStepScriptRyuAdult = { addr = 0x801CFBE0, type = "func", source = "Runs one step of the character route script with this image's turn facings: selects the turn script of direction, or counts the step timer down and runs the next script. It is the step-table copy of adult Ryu, route 2 of this image's party row (the task's byte 0x2C selects the route)." }
PlChar_WalkStep = { addr = 0x801CFD20, type = "func", source = "Runs one route step of a field character: turns an even direction to a free neighbouring facing, reads the height ahead, then requests walk script 0x46 + (direction - 1) / 2 and advances header.step when the ground-ahead test passes with a height difference of at least 65, else sets the marker at byte 0x2B and plays the blocked SE." }
PlChar_AdvanceScript = { addr = 0x801D0208, type = "func", source = "Advances the character script by its phase in byte 0x0B: phase 0 and the final phase wait for Script_AnimStepOnce; on completion it clears the marker at byte 0x2B and the panel mode byte of g_Game.current." }
PlChar_ProbeCellSpawn = { addr = 0x801D02F4, type = "func", source = "Probes a map cell for the character: cell 0xF2 claims a free actor slot, spawns a field record (sometimes a second) and clears the cell; cell 0xF8 spawns a record, hands out item 0x56 with a message and clears the cell. Returns 1 when it handled the cell." }
PlChar_SpawnActor = { addr = 0x801D04EC, type = "func", source = "Claims a free g_SpawnedActors entry for a character proximity actor: header.flags 1, type 0x34, header.mode from the type argument, position from the x and y arguments (16.16) and z one 0x100 above the ground height." }
PlChar_ProbeFacingCell = { addr = 0x801D05D0, type = "func", source = "Returns 1 when the cell two facing steps ahead of the character holds a record (Actor_FindInRange) or has map cell code 0xF2, also testing the next cell when the x or y fraction is nonzero." }
