["emi/world04/area174/13"]
g_AreaModuleId = { addr = 0x801F2C00, source = "Module id of the area: the first payload word of its overlay, 52 + the area number." }
Area_UpdateShots = { addr = 0x801F2EC4, type = "func", source = "Updates the active shots: moves them by their velocities, re-aims them, ages and frees them, and draws each; returns whether any was active." }
Actor_AdvanceWhenPartyNear = { addr = 0x801F363C, type = "func", source = "Runs Area_Update after WorldMap_AdvanceWhenPartyNear, which adds 1 to header.step (byte 0x02) and plays SE EMI_SE_ID(2, 0) when g_GameStateIndex is 0, once the party is within half a cell of the work cell along one axis and within a cell of it along the other (axes by direction)." }
Actor_SlideScreenX = { addr = 0x801F377C, type = "func", source = "Adds ACTOR_SCREEN_X_STEP to the screen origin of the work record and, once it reaches ACTOR_SCREEN_X_THRESHOLD, adds 1 to the step (byte 0x02); runs Area_Update." }
Actor_AdvanceWhenPartyAway = { addr = 0x801F37D8, type = "func", source = "Adds 1 to header.step (byte 0x02) when the party position (D_80145EC4, D_80145EC8) is more than two cells from the work cell along one axis, or from both of its halves along the other (axes by direction); then runs Area_Update." }
Actor_SlideScreenDown16 = { addr = 0x801F38E8, type = "func", source = "Subtracts 0x10 from the actor screen_y; at 0 or below sets header.step (byte 0x02) to 1 and plays SE EMI_SE_ID(2, 1) when g_GameStateIndex is GAME_REQUEST_IDLE; then runs Area_Update." }
Area_Update = { addr = 0x801F3958, type = "func", source = "Sets header.step (byte 0x02) to 3 when D_801454F2 is 2, then draws the area HUD at the actor screen_x with Area_DrawHud." }
Area_FreePaletteOnChange = { addr = 0x801F3CE4, type = "func", source = "same body as emi/world04/area198/13@0x801F35A4 Area_FreePaletteOnChange" }
Actor_BeginScriptFromAreaTable = { addr = 0x801F4100, type = "func", source = "Reads the script row of the loaded area at the script state row and cursor, begins the actor script of that step at the saved script_pc - 2, stores the row argument in byte 0x2A and advances the cursor by 2." }
Actor_BeginScriptFromAreaTableAtStart = { addr = 0x801F41A8, type = "func", source = "Starts the area script step at the cursor once the task script_pc is 2, otherwise moves the cursor back 2 to repeat the command." }
Area_FreePaletteOnAreaChange = { addr = 0x801F4D1C, type = "func", source = "Frees the palette slots of the task through GFX_FreePaletteSlotOwner when g_GameStateIndex is GAME_REQUEST_AREA_CHANGE; no C caller, it is reached through the area174 tables." }
