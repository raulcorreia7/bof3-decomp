jtbl_801F2C04 = { addr = 0x801F2C04, type = "Callback", size = 0xF4, source = "The switch table of func_801F4B58: 61 jump targets of its jr dispatch." }
Actor_AdvanceWhenPartyNear = { addr = 0x801F3DE8, type = "func", source = "Runs Area_Update after WorldMap_AdvanceWhenPartyNear, which adds 1 to header.step (byte 0x02) and plays SE EMI_SE_ID(2, 0) when g_GameStateIndex is 0, once the party is within half a cell of the work cell along one axis and within a cell of it along the other (axes by direction)." }
Actor_SlideScreenX = { addr = 0x801F3F28, type = "func", source = "Adds ACTOR_SCREEN_X_STEP to the screen origin of the work record and, once it reaches ACTOR_SCREEN_X_THRESHOLD, adds 1 to the step (byte 0x02); runs Area_Update." }
Actor_AdvanceOutsidePartyCell = { addr = 0x801F3F84, type = "func", source = "Adds 1 to header.step (byte 0x02) when the party position (D_80145EC4, D_80145EC8) is more than two cells from the work cell along one axis, or from both of its halves along the other (axes by direction)." }
Actor_SlideScreenDown16 = { addr = 0x801F4080, type = "func", source = "Subtracts 0x10 from the actor screen_y; at 0 or below sets header.step (byte 0x02) to 1 and plays SE EMI_SE_ID(2, 1) when g_GameStateIndex is GAME_REQUEST_IDLE; then runs Area_Update." }
Area_Update = { addr = 0x801F40F0, type = "func", source = "Sets header.step (byte 0x02) to 3 when D_801454F2 is 2, then draws the area HUD at the actor screen_x with Area_DrawHud." }
