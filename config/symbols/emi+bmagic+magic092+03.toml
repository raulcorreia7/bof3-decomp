g_BMagicFireblastFlameSteps = { addr = 0x801F07D8, source = "The steps of the flame: place, grow, hold, fade." }
g_BMagicFireblastGlowSteps = { addr = 0x801F07E8, source = "The steps of a glow: place, grow, wait for the 0x80 mark, count down." }
