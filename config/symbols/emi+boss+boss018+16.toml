Boss_ChooseBattleEnding = { addr = 0x800C2258, type = "func", source = "Chooses how the boss battle of boss018 ends. On victory sets D_80146875 to 0x1A when bit 1 of g_BattleBossFlags is set, else to 0x1B, and runs Battle_EndVictory. On defeat with bit 0 of g_BattleBossFlags clear, runs func_800C2A40, sets D_80146875 to 0x1C (scene flag 0x23 clear) or 0x3A (flag 0x23 set, 0x24 clear) and runs Battle_EndToArea; otherwise runs Battle_EndDefeat. Always copies four battler words to D_801FD6FC to D_801FD702." }
Boss_EndBattle = { addr = 0x800C2378, type = "func", source = "Ends the boss battle of boss018 (g_BattleEndHook): when bit 0x4000 of the halfword at D_801EB6B2 is clear, runs Battle_CopyActorEntry and Battle_ShowActorEntry for battle slot 0; always runs both for slots 3 and 4." }
Boss_InstallBattleHooks2 = { addr = 0x800C23F8, type = "func", source = "Installs the boss battle hooks of boss018 (set 2): Boss_ChooseBattleEnding2 into g_BattleChooseEndingHook, Boss_EndBattle2 into g_BattleEndHook and Boss_RunBattleEvent2 into g_BossBattleEventHook." }
Boss_RunBattleEvent2 = { addr = 0x800C2430, type = "func", source = "Handles the boss battle events of boss018 (set 2): g_BossBattleEventHook calls it with the event mode (0 to 6) from the battle loop and tests its u8 result." }
Boss_ChooseBattleEnding2 = { addr = 0x800C253C, type = "func", source = "Chooses how the boss battle of boss018 (set 2) ends. On victory sets D_80146875 to 0x1A when bit 1 of g_BattleBossFlags is set, else to 0x23, and runs Battle_EndVictory. On defeat with bit 0 of g_BattleBossFlags clear, runs func_800C2A40, sets D_80146875 to 0x1C (scene flag 0x23 clear) or 0x3A (flag 0x23 set, 0x24 clear) and runs Battle_EndToArea; otherwise runs Battle_EndDefeat. Always copies four battler words to D_801FD6FC to D_801FD702." }
Boss_EndBattle2 = { addr = 0x800C265C, type = "func", source = "Ends the boss battle of boss018 (set 2) (g_BattleEndHook): when bit 0x4000 of the halfword at D_801EB6B2 is clear, runs Battle_CopyActorEntry and Battle_ShowActorEntry for battle slot 1; always runs both for slots 3 and 4." }
Boss_InstallBattleHooks3 = { addr = 0x800C26DC, type = "func", source = "Installs the boss battle hooks of boss018 (set 3): Boss_ChooseBattleEnding3 into g_BattleChooseEndingHook, Boss_EndBattle3 into g_BattleEndHook and Boss_RunBattleEvent3 into g_BossBattleEventHook." }
