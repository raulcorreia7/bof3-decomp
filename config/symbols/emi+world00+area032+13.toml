GFX_AddPrim = { addr = 0x8014E5A0, type = "func", source = "Appends the current primitive to one ordering-table head and advances the shared primitive cursor while the requested byte count fits the active buffer." }
Actor_TrackFocus = { addr = 0x801F2C48, type = "func", source = "Projects the party focus with RotTransPers into the ordering-table screen buffer, stores the result in the work record and advances the handler index." }
Area_ShrinkDisc = { addr = 0x801F2E64, type = "func", source = "Step 3 of the s_MarkerModes table in marker_work.c, after the grow step func_801F2D18 and the hold step func_801F2DAC: draws the shaded disc at the task's screen position with the timer as radius, counts the radius down and advances the mode when it goes negative." }
Scene_ClearActor = { addr = 0x801F2EE4, type = "func", source = "Last used step of the s_MarkerModes table in marker_work.c: calls Actor_Clear to remove the running actor; the same body as Scene_ClearActor in scena15 and many other images." }
GFX_DrawShadedDisc = { addr = 0x801F2F04, type = "func", source = "Fans 32 POLY_G3 around (x, y), each spanning 128 of the 4096-step angle and reaching radius through rcos and rsin; the centre vertex uses center_shade, the rim vertices rim_shade." }
Actor_Reveal = { addr = 0x801F3480, type = "func", source = "Keeps the actor slot at the work byte 0x0B hidden until the timer at byte 0x09 reaches zero, then shows it, clears the two actor slots at the work bytes 0x03 and 0x04 and sets the handler index at byte 0x01 to 2." }
Actor_FreePaletteFades = { addr = 0x801F35B4, type = "func", source = "Frees the two palette fade targets of the actor slot and resets the area work." }
UI_MessageClear = { addr = 0x801F36A0, type = "func", source = "Clears the message request; when the menu selection is idle sets g_SceneEventMode to SCENE_EVENT_INN, g_SceneEventStep to 5 and g_SceneEventSelection to 0xFF." }
