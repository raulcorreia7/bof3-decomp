Well_StepSwish = { addr = 0x801F3304, type = "func", source = "mode WELL_MODE_SWISH_STEP: moves the camera back along the swish; after WELL_SWISH_STEPS steps it snaps the camera and sets WELL_MODE_RAISE_BEGIN, otherwise waits for the next press in WELL_MODE_SWISH_INPUT" }
Well_BeginRaise = { addr = 0x801F3538, type = "func", source = "mode WELL_MODE_RAISE_BEGIN: counts the first X press of the raising phase and sets WELL_MODE_RAISE_READY" }
Well_RaiseReady = { addr = 0x801F3578, type = "func", source = "raising phase, mode WELL_MODE_RAISE_READY: ticks g_WellRaiseTimer; an X press counts and sets WELL_MODE_RAISE_COUNT, WELL_IDLE_FRAMES_MAX idle frames set WELL_MODE_FAIL, running out sets WELL_MODE_RAISE_CHECK" }
Well_RaiseCount = { addr = 0x801F3658, type = "func", source = "raising phase, mode WELL_MODE_RAISE_COUNT: counts an X press and sets WELL_MODE_RAISE_REPEAT, or WELL_MODE_FAIL after WELL_IDLE_FRAMES_MAX idle frames" }
Well_RaiseRepeat = { addr = 0x801F36CC, type = "func", source = "raising phase, mode WELL_MODE_RAISE_REPEAT: ticks g_WellRaiseTimer; an X press counts and sets WELL_MODE_RAISE_READY, otherwise WELL_MODE_RAISE_COUNT, running out sets WELL_MODE_RAISE_CHECK" }
Well_TestRaiseCount = { addr = 0x801F3764, type = "func", source = "mode WELL_MODE_RAISE_CHECK: sets WELL_MODE_SUCCESS when g_WellPressCount is within one of g_WellLowerCount, else WELL_MODE_FAIL" }
