Well_LowerCount = { addr = 0x801F2F24, type = "func", source = "lowering phase, mode WELL_MODE_LOWER_COUNT: counts a Triangle press and sets WELL_MODE_LOWER_REPEAT, or WELL_MODE_FAIL after WELL_IDLE_FRAMES_MAX idle frames" }
Well_LowerRepeat = { addr = 0x801F2F98, type = "func", source = "lowering phase, mode WELL_MODE_LOWER_REPEAT: ticks g_WellLowerTimer; a Triangle press counts and sets WELL_MODE_LOWER_READY, running out plays WELL_CUE_LOWER_END_REPEAT, stores the count in g_WellLowerCount and sets WELL_MODE_LOWER_DONE" }
Well_EndLowering = { addr = 0x801F3074, type = "func", source = "mode WELL_MODE_LOWER_DONE: sets WELL_MODE_FAIL when no press was counted, else clears g_WellIdleFrames and sets WELL_MODE_SWISH_INPUT" }
