["emi/bmagic/magic072/03"]
Battle_MarkDamaged = { addr = 0x800A9820, alias = true, source = "Marks the selected battlers as damaged." }
Battle_ProjectRange = { addr = 0x800AF764, alias = true, source = "Projects the battle range to the screen." }
Battle_FadePoisonedBattler = { addr = 0x800AF814, type = "func", source = "Starts the palette fade of the battler at battler_index when it is poisoned: party members 0 to 2 from g_Game.members, enemies from g_BattleEnemies; does nothing for a blocked slot.", alias = true }
Effect_Reset = { addr = 0x801E5988, type = "func", source = "Clears every timer, state and flag byte of the shared BattleEffect work record; every effect countdown calls it first. battle/03 owns the body.", alias = true }
g_BattleEffectBattler = { addr = 0x801EB4E0, source = "the battler the running effect acts on; Battle_UpdateEffects stores it for each effect step (emi/battle/battle/03 owns the cell)" }
g_BMagicSparkleModes = { addr = 0x801EEC04, source = "The routines of the task, run by header.mode: init, replace the palette fade, brighten, wait for few sparkles, fade out, finish." }
g_BMagicSparkleSteps = { addr = 0x801EEC1C, source = "The routines of a sparkle, run by header.step: launch, grow, fade." }
BMagic_SparkleUpdate = { addr = 0x801EEC28, type = "func", source = "The module entry: runs the task step that header.mode selects from g_BMagicSparkleModes, then steps every sparkle in use with g_BattleEffectBattler set to that sparkle's battler." }
BMagic_SparkleInit = { addr = 0x801EED38, type = "func", source = "Task mode 0: clears the sparkle pool, copies the facing and position of the selected battler into the task, spawns the sparkles of EFFECT_SPARKLE_TYPE with a longer launch delay for each group of four, and plays the sound." }
Effect_ReplacePaletteFade = { addr = 0x801EEFA4, type = "func", source = "When the effect timer (byte 0x09) reaches zero frees the selected actor's palette fade, allocates a new one (index in byte 0x0A), restarts the timer at 8 and advances header.mode (byte 0x01) in magic072 (Restore)." }
Effect_BrightenPalette = { addr = 0x801EF04C, type = "func", source = "Raises the red, green and blue offsets of the palette fade entry the effect counter (byte 0x0A) names by one per frame and advances header.mode (byte 0x01) when the effect timer (byte 0x09) reaches zero in magic072 (Restore)." }
Effect_SparkleWait = { addr = 0x801EF15C, type = "func", source = "Task mode 3: once fewer than 5 sparkles are alive, reloads the timer with 8 and advances header.mode in magic072 (Restore)." }
Effect_FadePaletteOut = { addr = 0x801EF1A4, type = "func", source = "same body as emi/bmagic/magic162/03@0x801EF1A0 Effect_FadePaletteOut" }
Effect_MarkDamagedOnZeroTick = { addr = 0x801EF2DC, type = "func", source = "When the effect ticker (byte 0x0B) is zero marks the battlers of the target selector damaged, raises BATTLE_STATE_EFFECT_PLAYING and resets the effect in magic072 (Restore)." }
Effect_SparkleRunMode = { addr = 0x801EF33C, type = "func", source = "Runs the handler that header.mode of the current sparkle selects from g_BMagicSparkleRecordModes." }
Effect_SparkleStep = { addr = 0x801EF380, type = "func", source = "Runs the step that header.step of the current sparkle selects; a sparkle still in use after its first step draws its disc, and its rays and wedges on three frames in four." }
Effect_SparkleLaunch = { addr = 0x801EF47C, type = "func", source = "Counts the launch delay (byte 0x05) down; at zero places the sparkle at the battler's screen point plus a random launch offset, picks its drift (byte 0x08), sway phase (+0x0C), rise (byte 0x07), resets the delay to 16 and advances header.step (byte 0x02)." }
Effect_SparkleGrow = { addr = 0x801EF67C, type = "func", source = "Sparkle step 1: sways the current sparkle while its radius grows by 1 per frame until it reaches its rise, then advances the step." }
Effect_SparkleFade = { addr = 0x801EF72C, type = "func", source = "Sparkle step 2: sways the current sparkle, shrinks its radius every fourth frame and counts its timer down; at zero lowers the task's count of live sparkles and clears the record." }
Effect_SparkleDrawRays = { addr = 0x801EF810, type = "func", source = "Draws the four rays of a sparkle from its point out to the radius, tinted at the centre and white at the far end; one body shared with the other bmagic overlays." }
Effect_SparkleDrawWedges = { addr = 0x801EFA44, type = "func", source = "Draws the four wedges of a sparkle from its point through the half radius to the radius, white at the centre and far points and tinted at the half radius; one body shared with the other bmagic overlays." }
Effect_SparkleDrawDisc = { addr = 0x801EFCDC, type = "func", source = "Draws the disc of the current sparkle as eight POLY_G3 wedges around its screen point: the record's bytes 0x20/0x22 are the point, byte 0x06 plus a random 0-3 is the radius, bytes 0x03 and 0x04 pick the colour row and type, and byte 0x05 scales it; one body shared with the other bmagic overlays" }
Effect_SparkleAlloc = { addr = 0x801F0000, type = "func", source = "Claims the first free record of the sparkle pool and returns its index, or GAME_NONE when the pool is full." }
Effect_SparkleClear = { addr = 0x801F006C, type = "func", source = "Frees the current sparkle record by clearing its header, shade row and type." }
g_BMagicSparkleOffsets = { addr = 0x801F00BC, source = "The launch offsets of a sparkle from the screen point of its battler, picked by the sparkle's index modulo 32." }
g_BMagicSparkleColors = { addr = 0x801F015C, source = "The four shade rows of each sparkle type." }
g_BMagicSparkleCounts = { addr = 0x801F0198, source = "The sparkles each sparkle type spawns." }
g_BMagicSparkleDelays = { addr = 0x801F01A0, source = "The launch delay of each group of four sparkles, per sparkle type." }
g_BMagicSparkleRises = { addr = 0x801F01A8, source = "The shortest rise of a sparkle of each type, in frames." }
g_BMagicSparkleRecordModes = { addr = 0x801F01B0, source = "The routines of a sparkle record, run by its header.mode: the sparkle step." }
g_BMagicSparkles = { addr = 0x801F01B4, source = "The sparkle pool: 128 records, in use while bit 0 of header.flags is set." }
g_BMagicSparkle = { addr = 0x801F17B4, source = "The sparkle record being updated." }
