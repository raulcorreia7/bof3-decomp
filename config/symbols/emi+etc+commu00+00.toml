["emi/etc/commu00/00"]
g_FairyVillageOverlayHeader = { addr = 0x801EEC00, source = "The fairy village overlay's payload prologue: its overlay id, the exploration success thresholds and the label caps." }
jtbl_801EEC0C = { addr = 0x801EEC0C, type = "Callback", source = "The switch table of Fairy_SpawnWorker: the jump targets of its jr dispatch." }
g_FairyGifts = { addr = 0x801EEC48, source = "Fairy_GrantGift copies the FairyGift table" }
Fairy_InitVillage = { addr = 0x801EECA4, type = "func", source = "Sets up the fairy village each time g_GameAreaId changes from g_GameLastAreaId: with no active fairy it adds BATTLE_PARTY_CHARACTERS_COUNT fairies and stamps g_BattleCount into the roster counters; otherwise it queues the new rooms and runs the roster upkeep. Always ends by building the village jobs." }
Fairy_AddRooms = { addr = 0x801EEDF8, type = "func", source = "Queues the fairy village room of kind 4 and of kind 5 into D_80145E60 once each, for the areas between D_801455C0 and g_GameAreaId, then stores g_GameAreaId into D_801455C0." }
Fairy_JoinVillage = { addr = 0x801F00D4, type = "func", source = "Adds one fairy to the village: takes the first inactive g_FairyJobs row from a random start below 60, sets active to 1 and type to FAIRY_JOB_IDLE, stamps progress_anchor with g_BattleCount, copies the fairy 5-byte name and queues the row index." }
Fairy_CountFairies = { addr = 0x801F02E4, type = "func", source = "Returns the number of fairy rows of g_FairyJobs whose active byte is nonzero, out of 60." }
Fairy_StartJobs = { addr = 0x801F0534, type = "func", source = "Builds one village actor per active fairy of g_FairyJobs: an idle fairy runs func_801F0BF4 and func_801F0718, a type below FAIRY_JOB_HUNT func_801F08D8, and FAIRY_JOB_CLEAR and FAIRY_JOB_BUILD fairies get a random label from 0xB6 or 0xBC (0xCD or 0xCE in the late and dolphin areas)." }
Fairy_SpawnWorker = { addr = 0x801F08D8, type = "func", source = "Starts the actor of a job's worker fairy: places it at the job's position from D_801F25A4, selects its script, and runs the setup for the room kind of the job. Called by Fairy_StartJobs for each job of a kind below hunting." }
Fairy_ShowPlayRecordMessage = { addr = 0x801F1318, type = "func", source = "Formats the play clock hours and minutes, g_BattleCount and D_80145030 into text variables 0 to 3, starts area message FAIRY_MESSAGE_PLAY_RECORD and sets g_GameStateIndex to GAME_REQUEST_MESSAGE." }
Scene_ClearEventState = { addr = 0x801F1684, type = "func", source = "Ends the scene event: clears the script-active flag, sets g_SceneEventMode to SCENE_EVENT_NONE and zeroes g_SceneEventStep and g_SceneEventSelection." }
Fairy_RunCommu01Scene = { addr = 0x801F16BC, type = "func", source = "Runs the commu01 scene's steps: g_FairyCommu01Steps indexed by g_SceneEventStep, whose step 3 is the commu01 overlay entry. g_SceneEvents entry 14, selected by g_SceneEventMode." }
Fairy_EndEventLoad = { addr = 0x801F17A4, type = "func", source = "Event step after each Fairy_LoadCommu0N stream: waits EMI_IsReady, GFX_ResetPalette, raises g_GfxPalettePending, clears the event latches and advances FAIRY_EVENT_STEP (D_801F24FC_Data step tables)." }
Fairy_RunGiftScene = { addr = 0x801F18BC, type = "func", source = "Runs the fairy gift event's steps: g_FairyGiftSteps indexed by g_SceneEventStep, starting with Fairy_GrantGift. g_SceneEvents entry 21." }
Fairy_GrantGift = { addr = 0x801F18F8, type = "func", source = "Gives the selected fairy gift: counts the battles since progress_anchor against the 20 g_FairyGifts thresholds, adds the item of the highest threshold reached and starts area message FAIRY_MESSAGE_GIFT_RECEIVED, or message FAIRY_MESSAGE_NO_GIFT_YET below the first; resets progress_anchor to g_BattleCount when the item is added." }
Fairy_RunExploreReward = { addr = 0x801F1B8C, type = "func", source = "Runs the fairy explore-reward event's steps: g_FairyExploreRewardSteps indexed by g_SceneEventStep, whose only step is Fairy_RollExploreReward. g_SceneEvents entry 22." }
Fairy_RollExploreReward = { addr = 0x801F1BC8, type = "func", source = "Resolves the exploration of the selected fairy: for record_state 3 starts message FAIRY_MESSAGE_EXPLORE_NO_REWARD and resets the anchor; for record_state 2 rolls a random reward among the 16-entry tiers of g_FairyExploreRewards, adds the item (FAIRY_MESSAGE_EXPLORE_FOUND_ITEM) or reports a full inventory (FAIRY_MESSAGE_EXPLORE_BAG_FULL)." }
Fairy_RunCommu02Scene = { addr = 0x801F1E74, type = "func", source = "Runs the commu02 scene's steps: g_FairyCommu02Steps indexed by g_SceneEventStep, which loads the commu02 overlay. g_SceneEvents entry 23." }
Fairy_RunCommu02Events = { addr = 0x801F1F10, type = "func", source = "Runs the commu02 event the scene selected: g_FairyCommu02Events indexed by g_SceneEventSelection; step 2 of g_FairyCommu02Steps." }
Fairy_RunCommu03Scene = { addr = 0x801F1F9C, type = "func", source = "Runs the commu03 scene's steps: g_FairyCommu03Steps indexed by g_SceneEventStep, whose step 2 is the commu03 overlay entry. g_SceneEvents entry 24." }
Fairy_RunCommu04Scene = { addr = 0x801F2020, type = "func", source = "Runs the commu04 scene's steps: g_FairyCommu04Steps indexed by g_SceneEventStep, whose step 4 is the commu04 overlay entry. g_SceneEvents entry 25." }
Fairy_RunCommu05Scene = { addr = 0x801F228C, type = "func", source = "Runs the commu05 scene's steps: g_FairyCommu05Steps indexed by g_SceneEventStep, whose step 2 is the commu05 overlay entry. g_SceneEvents entry 26." }
g_FairyCommu01Steps = { addr = 0x801F25EC, source = "the 6 step handlers of the commu01 scene that the village runs through Fairy_RunCommu01Scene, indexed by g_SceneEventStep; entry 3 is the commu01 overlay entry" }
g_FairyGiftSteps = { addr = 0x801F2604, source = "the 3 step handlers of the fairy gift event, starting with Fairy_GrantGift, run through Fairy_RunGiftScene and indexed by g_SceneEventStep" }
g_FairyExploreRewardSteps = { addr = 0x801F2610, source = "the step handler of the fairy explore-reward event, Fairy_RollExploreReward, run through Fairy_RunExploreReward and indexed by g_SceneEventStep" }
g_FairyExploreRewards = { addr = 0x801F2618, source = "Reward table of fairy exploration: 3 tiers of 16 entries, each a pair of item type and item index; Fairy_RollExploreReward picks one entry of the tier its roll selects." }
g_FairyCommu02Steps = { addr = 0x801F2678, source = "the 5 step handlers of the commu02 scene that the village runs through Fairy_RunCommu02Scene, indexed by g_SceneEventStep" }
