g_FairyCommu03Steps = { addr = 0x801F269C, source = "the 5 step handlers of the commu03 scene that the village runs through Fairy_RunCommu03Scene, indexed by g_SceneEventStep; entry 2 is the commu03 overlay entry" }
g_FairyCommu04Steps = { addr = 0x801F26B0, source = "the 7 step handlers of the commu04 scene that the village runs through Fairy_RunCommu04Scene, indexed by g_SceneEventStep; entry 4 is the commu04 overlay entry" }
g_FairyCommu05Steps = { addr = 0x801F26EC, source = "the 5 step handlers of the commu05 scene that the village runs through Fairy_RunCommu05Scene, indexed by g_SceneEventStep; entry 2 is the commu05 overlay entry" }
