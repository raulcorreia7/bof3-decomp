[project]
name = "rebof3"
version = "0.1.0"
license = "CC0-1.0"
description = "Build and analysis tools for the bof3-decomp matching decompilation of Breath of Fire III"
readme = "README.md"
authors = [{ name = "raulcorreia7" }]
keywords = ["decompilation", "playstation", "breath-of-fire"]
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  # The splitter and the disassembler, pinned by uv.lock.
  "splat64[mips]==0.50.1",
  "spimdisasm==1.42.4",
]

[project.urls]
Homepage = "https://github.com/raulcorreia7/bof3-decomp"
Issues = "https://github.com/raulcorreia7/bof3-decomp/issues"

[dependency-groups]
dev = ["pytest>=8.0", "ruff==0.17.3"]
matching = ["colorama>=0.4.6", "levenshtein>=0.27.0", "toml>=0.10.2", "watchdog>=6.0.0"]

[tool.uv]
default-groups = []
python-downloads = "manual"

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tools/tests"]

[tool.ruff]
target-version = "py312"
# The tools run from tools/, so its modules are first-party.
src = ["tools"]

[tool.ruff.lint]
# Real defects and import order. The pinned ruff's default set is F and a few E; these add bugbear,
# pyupgrade, an explicit subprocess `check`, context-managed files and unused `noqa`.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "PLW1510", "SIM115", "RUF100"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
